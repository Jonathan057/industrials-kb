{zh:"GE Aerospace 是 1892 年創立的奇異(GE)在 2024 年 4 月完成世紀分拆(能源分出 GE Vernova、醫療分出 GE HealthCare)後留下的核心本體,續用 GE 代碼,總部位於俄亥俄州辛辛那提 Evendale,由帶領整場改造的 Larry Culp 掌舵。兩大板塊:商用引擎與服務(CFM56/LEAP 窄體、GEnx/GE90/GE9X 寬體引擎)與國防及推進技術(戰機與直升機引擎、極音速推進)。全球約有七成商用航班由 GE 及合資的 CFM 引擎推動,安裝基礎約 4.5 萬具。",
 en:"GE Aerospace is what remains of the General Electric founded in 1892 after its epochal 2024 breakup (energy became GE Vernova, healthcare GE HealthCare) — keeping the GE ticker, headquartered in Evendale, Cincinnati, and led by transformation architect Larry Culp. Two segments: Commercial Engines & Services (CFM56/LEAP narrowbody, GEnx/GE90/GE9X widebody engines) and Defense & Propulsion Technologies (fighter and helicopter engines, hypersonics). Roughly seven of ten commercial flights worldwide are powered by GE or its CFM joint venture, on an installed base of ~45,000 engines."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"噴射引擎是工業界最極致的「刮鬍刀+刀片」模式:新引擎近乎成本價甚至虧本賣(GE9X 爬坡期虧損 2028 年才觸頂),真正的利潤在其後 20–40 年的維修、翻修與備件——每具引擎生命週期的售後收入可達售價數倍。約 1,700 億美元的商用服務積壓,意味未來多年的高利潤率收入已被預訂;與 Safran 各半持股的 CFM 合資(LEAP 引擎)則壟斷波音 737 MAX、分食空巴 A320neo。Culp 的 FLIGHT DECK 精實體系是執行面的核心:F110 關鍵件交期 -60%、CFM56 總裝時間 -50%。",
 en:"Jet engines are industry's ultimate razor-and-blades model: new engines sell near cost or at a loss (GE9X ramp losses peak by 2028), while the real profit sits in 20–40 years of maintenance, overhaul and spares — lifetime aftermarket revenue can run several times the sale price. The ~$170B commercial-services backlog means years of high-margin revenue is pre-booked; the 50/50 CFM joint venture with Safran (LEAP) monopolizes the Boeing 737 MAX and splits the Airbus A320neo. Culp's FLIGHT DECK lean operating system is the execution engine: F110 critical-part lead times down 60%, CFM56 final-assembly time down 50%."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"以商用引擎裝機量計,GE+CFM 是無可爭議的世界第一,對手僅 Pratt & Whitney(RTX 旗下,GTF 引擎)與 Rolls-Royce(寬體);窄體市場實質上是 CFM 與 P&W 的雙寡頭。在知識庫的航太板塊裡,GE 與 RTX 是「引擎雙雄」的直接對照:GE 更純(無飛彈與航電稀釋)、利潤率與現金流更強,估值也因此更高(前瞻約 41 倍 vs RTX 約 28 倍)。供應鏈仍是全行業瓶頸——備件交付延遲量 Q2 環比 +20%,說明需求仍遠大於供給。",
 en:"By commercial installed base, GE+CFM is the undisputed world No. 1, with only Pratt & Whitney (RTX's GTF) and Rolls-Royce (widebody) as rivals; the narrowbody market is effectively a CFM–P&W duopoly. Within this KB's aerospace shelf, GE and RTX form the direct 'engine duo' comparison: GE is purer (no missiles or avionics dilution) with stronger margins and cash flow — and a richer multiple to match (~41x forward vs RTX's ~28x). Supply chains remain the industry bottleneck — spare-parts delinquencies rose 20% sequentially in Q2, evidence that demand still far exceeds supply."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q2(7/16 公佈)全面超標:調整後營收 +24%、EPS 2.02 美元(+22%)、自由現金流 +43%,訂單 165 億美元;全年指引大幅上修(調整後營收高十位數成長、EPS 7.65–7.85、FCF 89–92 億美元),Jefferies、RBC、Bernstein 一致按讚。但股價財報後回落約 4% 至 315 美元附近——市場消化「訂單成長趨緩」與已然偏高的預期,GE9X(777-9 用)爬坡也壓低利潤率 130bps。中東衝突暫未改變客戶行為,上半年航班起降大致持平,管理層仍預期下半年溫和回升;約 2,100 億美元總積壓是最深的護城河。\n▸ 2026/9/25 更新:7 月范堡羅航展期間,IndiGo 與 CFM 簽署 1,000 具 LEAP-1A 引擎備忘錄,AerCap 選用 GEnx 驅動 15 架 787;今年 LEAP 交付量年增約 41%。9/8 宣布收購精密鑄件廠 Consolidated Precision Products(CPP)補強葉片鑄件產能,被視為改變 Howmet 等供應商競爭格局的關鍵一步。風險面:9 月波音執行長表示 777X 認證仍在等待 GE9X 引擎密封件修正。市場預估全年每股盈餘約 7.91 美元,已高於公司指引上緣;股價約 327 美元,距 52 週高點約低 16%。下次財報 10/20。",
 en:"Q2 2026 (out Jul 16) beat across the board: adjusted revenue +24%, EPS of $2.02 (+22%), free cash flow +43%, and $16.5B of orders; full-year guidance was raised sharply (high-teens adjusted revenue growth, $7.65–7.85 EPS, $8.9–9.2B FCF), with Jefferies, RBC and Bernstein applauding. Yet the stock eased ~4% to ~$315 post-print as the market digested moderating order growth against elevated expectations, while the GE9X ramp (for the 777-9) shaved 130bps off margins. The Middle East conflict hasn't changed customer behavior — H1 departures were roughly flat, with a modest H2 recovery still expected; the $210B+ total backlog remains the deepest moat.\n▸ Update (Sep 25, 2026): Around the July Farnborough Airshow, IndiGo and CFM signed a memorandum for 1,000 LEAP-1A engines and AerCap picked GEnx for 15 more 787s; LEAP deliveries are up about 41% this year. On Sep 8 GE agreed to buy Consolidated Precision Products (CPP) to add blade and vane casting capacity, a move seen as reshaping supplier dynamics for Howmet and peers. On the risk side, Boeing's chief executive said in September that 777X certification still awaits a GE9X engine seal fix. Consensus now expects about $7.91 of full year earnings per share, above the top of guidance; shares near $327 sit about 16% below the 52 week high. Next report: Oct 20."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Bombardier 1942 年由 Joseph-Armand Bombardier 以雪上摩托車起家,曾橫跨鐵路、支線客機與公務機的加拿大工業巨頭,在債務危機後斷臂求生:鐵路售予 Alstom(2021)、CRJ 客機售予三菱、航空結構業務出清,如今是純公務機公司,總部蒙特婁、約 1.8 萬名員工,於多倫多證交所以 BBD 交易。產品線:Challenger 350/3500/650 中型機與旗艦 Global 5500/6500/7500/8000 超遠程機,另以 Global 平台衍生軍用特種任務機切入國防市場。",
 en:"Founded in 1942 by Joseph-Armand Bombardier with the snowmobile, Bombardier was once a Canadian industrial giant spanning rail, regional jets and business jets — until a debt crisis forced radical surgery: rail sold to Alstom (2021), the CRJ to Mitsubishi, aerostructures divested. Today it is a pure business-jet company headquartered in Montreal with ~18,000 employees, trading as BBD on the TSX. The lineup: Challenger 350/3500/650 mid-size jets and the flagship Global 5500/6500/7500/8000 ultra-long-range family, with Global-based special-mission military derivatives opening a defense lane."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"公務機是航太業中「訂單先行、現金前置」的生意:客戶下訂支付訂金,積壓訂單直接決定產線能見度——203 億美元積壓約當兩年產能,Q1 單位 book-to-bill 高達 3.6 倍(機隊營運商大單+Global 8000 熱銷)。Martel 的轉型三部曲已完成:一是聚焦高毛利的大型公務機;二是服務網絡全球擴張(FY25 服務營收 23 億、+13%,Q1 再 +25%,並收購 Velocity MRO),把一次性賣機變成機隊生命週期收入;三是去槓桿——淨槓桿降至 1.8 倍、年省利息逾 5,200 萬美元,信評展望接連轉正。",
 en:"Business jets are aerospace's order-first, cash-up-front business: customers pay deposits at signing, and backlog directly sets production visibility — the $20.3B backlog covers roughly two years of output, with Q1's unit book-to-bill at a striking 3.6x (fleet-operator orders plus a hot Global 8000). Martel's three-act turnaround is complete: focus on high-margin large-cabin jets; expand the global service network (FY25 services revenue $2.3B, +13%, then +25% in Q1, plus the Velocity MRO acquisition) to convert one-time sales into fleet-lifecycle revenue; and deleverage — net leverage down to 1.8x, $52M+ of annual interest saved, and successive positive ratings-outlook moves."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在大型/超遠程公務機市場,Bombardier 與 Gulfstream(General Dynamics 旗下)、Dassault Falcon 構成三強,以交付量計居全球公務機製造商前列;2025 年 12 月服役的 Global 8000 以 Mach 0.95 成為全球最快民用飛機,正面迎戰 Gulfstream G700/G800。它是知識庫繼 CAE、ATS 後第三家加拿大公司,也是「利基全球冠軍」路線的又一例證——不做民航大飛機,專吃高淨值與企業機隊這塊高毛利蛋糕;富豪財富效應與企業機隊更新是需求底盤,美國關稅與認證政治風險則是懸頂之劍(現受 USMCA 豁免)。",
 en:"In large-cabin and ultra-long-range business jets, Bombardier forms the big three with Gulfstream (General Dynamics) and Dassault Falcon, ranking among the top business-jet makers by deliveries; the Global 8000, in service since December 2025 at Mach 0.95, is the world's fastest civil aircraft, squaring off against Gulfstream's G700/G800. It is the KB's third Canadian company after CAE and ATS, and another proof of the niche-global-champion path — skipping commercial airliners to feast on the high-margin wealth-and-corporate-fleet segment. Wealth effects and fleet renewal underpin demand; U.S. tariff and certification politics hang overhead (currently USMCA-exempt)."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"FY2025 以「全數指標超越指引」為轉型畫下句點:營收 95.5 億美元(+10%)、交付 157 架、積壓 175 億(+22%)。2026Q1(4/30 公佈)再上層樓:積壓衝上 203 億美元(+43%)、自由現金流 3.6 億創近二十年最佳 Q1,全年 FCF 指引上修至逾 10 億美元;上半年累計償債 8.6 億,S&P 展望轉正。供應商短暫斷鏈影響部分交機時程,全年交付仍指引逾 157 架。本庫尚缺可靠即時報價(TSX: BBD.B),下批更新補齊;屆時亦將建立 52 週區間與價格紀錄。\n▸ 2026/9/25 更新:第二季(7/30)營收 21.5 億美元、年增 6%,服務營收創紀錄 6.74 億美元、年增 14%,交付 32 架;調整後每股盈餘 2.50 美元,遠高於預期的 1.37 美元;自由現金流 2.28 億美元,上半年累計 5.88 億美元,全年自由現金流指引維持逾 10 億美元。積壓訂單增至 218 億美元(較年底增加 43 億),Global 8000 帶動單位訂單出貨比 1.5;償債 3.56 億美元,2030 年 11 月前無到期債務。9/8 美國總統威脅若不在美設廠將阻止其公務機銷往美國,股價自高點回落,目前約 312 加元。註:多倫多交易代號為 BBD.B。",
 en:"FY2025 closed the turnaround with every metric beating guidance: revenue of $9.55B (+10%), 157 deliveries, and a $17.5B backlog (+22%). Q1 2026 (Apr 30) went further: backlog surged to $20.3B (+43%), free cash flow of $360M was the best Q1 in nearly two decades, and full-year FCF guidance was raised above $1.0B; $860M of debt was repaid in H1 and S&P turned its outlook positive. A temporary supplier disruption shifted some delivery timing, but the >157-unit full-year target stands. This KB still lacks a reliable live quote (TSX: BBD.B) — it will be added next batch, along with the 52-week range and price log.\n▸ Update (Sep 25, 2026): Q2 (Jul 30) revenue of $2.15B rose 6%, with record services revenue of $674M (up 14%) and 32 deliveries; adjusted earnings per share of $2.50 crushed the $1.37 consensus, free cash flow was $228M ($588M in the first half), and full year free cash flow guidance stays above $1B. Backlog grew to $21.8B (up $4.3B from year end) on a 1.5 unit book to bill led by the Global 8000; $356M of debt was retired, leaving no maturities before November 2030. On Sep 8 the U.S. president threatened to block Bombardier jet sales to U.S. customers unless it builds there, and shares have eased from their high to about C$312. Note: the Toronto ticker is BBD.B."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Parker-Hannifin 創立於 1917 年,總部位於克里夫蘭,是「運動與控制(motion & control)」技術的全球領導者:液壓、氣動、過濾、密封、流體連接件與航太系統,產品滲透在幾乎所有會動的機器裡——從工程機械、工廠設備到飛機。約六萬名員工,兩大板塊:多元工業(北美+國際)與航太系統。近十年透過 Clarcor(過濾)、Lord(減震)、Exotic Metals 與 2022 年 63 億英鎊收購英國 Meggitt(航太),把航太佔比一路推升至三分之一。",
 en:"Founded in 1917 and headquartered in Cleveland, Parker-Hannifin is the global leader in motion & control technologies: hydraulics, pneumatics, filtration, sealing, fluid connectors and aerospace systems — components embedded in almost everything that moves, from construction machinery and factory equipment to aircraft. With ~60,000 employees, it runs two segments: Diversified Industrial (North America + International) and Aerospace Systems. A decade of deals — Clarcor (filtration), Lord (vibration control), Exotic Metals, and the £6.3B Meggitt acquisition in 2022 — has lifted aerospace to a third of revenue."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Parker 的護城河是「無所不在的小零件」:單一零件價值不高、卻是設備停擺的關鍵,客戶對價格不敏感、對交期與可靠度極敏感;數十萬個 SKU 加上全球分銷網絡(工業界的「便利店」),構成極分散、極難複製的長尾生意。The Win Strategy 營運系統則是利潤率引擎——調整後板塊利潤率從十年前的約 15% 一路推升至 27%。航太系統(引擎零件、液壓、燃油與煞車系統,OEM+售後各半)是新的利潤率之王:FY26Q3 達 29.5%,積壓 84 億美元,再宣布收購 CIRCOR 航太業務加碼。",
 en:"Parker's moat is the ubiquitous small part: individually low-value components that nonetheless ground equipment when they fail, making customers price-insensitive but ruthless about lead time and reliability; hundreds of thousands of SKUs plus a global distribution network (industry's convenience store) create a fragmented, hard-to-replicate long-tail business. The Win Strategy operating system is the margin engine — adjusted segment margins have climbed from ~15% a decade ago to 27%. Aerospace Systems (engine components, hydraulics, fuel and braking systems, split evenly OEM/aftermarket) is the new margin king: 29.5% in FY26 Q3 on an $8.4B backlog, with the CIRCOR aerospace acquisition adding more."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在工業液壓與流體動力領域,Parker 全球市佔第一,領先 Bosch Rexroth、Eaton(液壓已售予 Danfoss)與 SMC(氣動);航太液壓與燃油系統則與 Moog、Woodward、Safran 同列第一梯隊。它是本庫「多元工業」原型的最佳樣本:終端市場橫跨航太、工程機械(供貨 CAT、DE)、卡車(供貨 CMI 客戶)、半導體與生命科學,景氣感應度全面但分散。當前的組合槓桿清晰:航太(33% 營收)高速成長+工業緩步復甦(北美訂單轉正、重卡 OEM 訂單回升),雙引擎正在交棒。",
 en:"In industrial hydraulics and fluid power Parker holds the global No. 1 share, ahead of Bosch Rexroth, Eaton (whose hydraulics went to Danfoss) and SMC (pneumatics); in aerospace hydraulics and fuel systems it sits in the first tier with Moog, Woodward and Safran. It is this KB's best specimen of the diversified-industrial archetype: end markets span aerospace, construction equipment (supplying CAT and DE), trucks (supplying CMI's customers), semiconductors and life sciences — broad cyclicality, but dispersed. The current portfolio lever is clear: aerospace (33% of revenue) growing fast while industrial slowly recovers (North American orders turning positive, heavy-truck OEM orders rising) — a twin-engine handoff in progress."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"FY26Q3(3 月止,4/30 公佈)交出「五創紀錄」:營收 54.9 億美元(+10.6%)、調整後板塊營業利益/利潤率/EPS 與年初至今營運現金流皆創新高;航太營收 +15.5%、利潤率 29.5%,總積壓 125 億美元創紀錄。全年指引:營收 +7%、調整後 EPS 31.20 美元、調整後利潤率 27.2%。1 月底宣布收購 CIRCOR 商用與國防航太業務,延續「以航太換利潤率」的併購劇本;運輸市場展望由中個位數下滑改善至低個位數下滑。股價 850.76 美元(7/20)、前瞻約 27 倍;FY26Q4(6 月止)財報預計 8 月初公佈。\n▸ 2026/9/25 更新:2026 財年第四季(8/6)銷售創紀錄 57.6 億美元、年增 9.8%(有機 8%),調整後每股盈餘 9.27 美元、年增 21%;全年銷售 215 億美元首度突破 200 億,調整後板塊利潤率 27.3%、調整後每股盈餘 32.31 美元,營運現金流創紀錄 44 億美元。2027 財年指引:銷售成長 5.5% 至 8.5%、調整後每股盈餘 34.25 至 35.25 美元;長期利潤率目標由 27% 提高至 2031 財年 30%(舊目標提前一年達成)。也完成收購 Filtration Group,9 月簽訂 50 億美元循環信用額度。財報當天股價大漲約 6.7%;註:7/20 的舊紀錄價經查證有誤,已移除。",
 en:"FY26 Q3 (Mar-end, reported Apr 30) delivered five records: sales of $5.49B (+10.6%), plus all-time-high adjusted segment operating income, margin, EPS and YTD operating cash flow; aerospace grew 15.5% at a 29.5% margin, and total backlog hit a record $12.5B. Full-year guidance: sales +7%, adjusted EPS $31.20, adjusted margin 27.2%. The late-January deal for CIRCOR's commercial and defense aerospace business extends the buy-aerospace-for-margin playbook; the transportation outlook improved from mid- to low-single-digit organic decline. At $850.76 (Jul 20) the stock trades ~27x forward; FY26 Q4 (Jun-end) results are due in early August.\n▸ Update (Sep 25, 2026): Fiscal 2026 Q4 (Aug 6) sales hit a record $5.76B, up 9.8% (8% organic), with adjusted earnings per share of $9.27, up 21%; full year sales of $21.5B crossed $20B for the first time, with a 27.3% adjusted segment margin, $32.31 adjusted earnings per share and record operating cash flow of $4.4B. Fiscal 2027 guidance calls for 5.5% to 8.5% sales growth and $34.25 to $35.25 adjusted earnings per share, and the long term margin target rose from 27% to 30% by fiscal 2031 after the old goal was hit a year early. Parker also closed the Filtration Group acquisition and signed a new $5B revolving credit facility in September. Shares rose about 6.7% on results day; note: the Jul 20 log price failed verification and was removed."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Quanta Services 創立於 1997 年,總部位於休士頓,是北美最大的電力基礎設施「專業承包商」:輸電線路、變電站、配電網、再生能源電站(旗下 Blattner 是美國最大再生能源 EPC 之一)與地下管線的工程、施工與維護。它的核心資產不是廠房而是人——約六萬名以技術工人(craft labor)為主的隊伍,在缺工的美國,這支能爬電塔、拉高壓線的大軍本身就是稀缺資源。客戶是公用事業、發電商、雲端巨頭與管線公司。",
 en:"Founded in 1997 and headquartered in Houston, Quanta Services is North America's largest specialty contractor for electric infrastructure: engineering, construction and maintenance of transmission lines, substations, distribution networks, renewable plants (its Blattner unit is among America's largest renewables EPCs) and underground utilities. Its core asset is not factories but people — a ~60,000-strong, craft-labor-heavy workforce; in a labor-short America, an army that can climb towers and string high-voltage line is itself the scarce resource. Customers are utilities, generators, hyperscalers and pipeline operators."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Quanta 是「電力超級週期」裡最純粹的執行層:GEV 賣渦輪機、ETN 賣配電設備,但把電從電廠送到資料中心的塔、線、站,得靠 Quanta 的人去蓋。收入結構以框架協議與多年期計畫型合約(MSA)為主,與大型公用事業形成長期綁定,平滑了單案風險;自建變壓器供應與預製工廠則對沖行業最緊的物料瓶頸。積壓訂單 485 億美元創紀錄、其中電力板塊 401 億,約 159 億將於 12 個月內轉化——這是全庫最能直接量化「電網投資落地速度」的數字。",
 en:"Quanta is the purest execution layer of the power supercycle: GEV sells turbines and ETN sells distribution gear, but the towers, lines and substations that carry electricity from plant to data center must be built by Quanta's crews. Revenue is anchored in framework agreements and multi-year programmatic MSAs with major utilities, smoothing single-project risk, while in-house transformer supply and off-site manufacturing hedge the industry's tightest material bottlenecks. The record $48.5B backlog — $40.1B of it Electric, with ~$15.9B converting within 12 months — is this KB's most direct gauge of how fast grid investment is actually landing."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在電力輸配電承包領域,Quanta 規模居北美第一,領先 MasTec、Primoris 等同業;再生能源 EPC(Blattner)與地下管線亦居前列。它與 GEV、ETN、VRT 構成本庫「AI 電力鏈」的四個層次:發電(GEV)→ 輸配電施工(PWR)→ 配電設備(ETN)→ 機房內(VRT)。需求端三箭齊發:電網老化更新、再生能源併網、資料中心接電——超大規模雲商如今直接成為其客戶。風險同樣清晰:約 51 倍的前瞻本益比隱含極高成長預期,勞動力成本、審批延宕與專案執行是永恆變數。",
 en:"In electric transmission and distribution contracting, Quanta is North America's No. 1 by scale, ahead of MasTec and Primoris; it also ranks top-tier in renewables EPC (Blattner) and underground utilities. With GEV, ETN and VRT it completes this KB's four-layer AI power chain: generation (GEV) → T&D construction (PWR) → distribution equipment (ETN) → inside the data hall (VRT). Demand fires on three fronts — grid-aging replacement, renewables interconnection, and data-center hookups, with hyperscalers now direct customers. The risks are equally clear: a ~51x forward multiple embeds lofty growth expectations, while labor costs, permitting delays and project execution are perpetual variables."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1(4/30 公佈)全面引爆:營收 78.7 億美元(+26.3%)、調整後 EPS 2.68 美元大勝預期 31%,積壓創紀錄 485 億美元;全年指引上修至營收 347–352 億、調整後 EPS 13.55–14.25 美元,並宣布 10 億美元庫藏股——隔日股價暴漲逾 17%。5 月 Oppenheimer 升評至優於大盤、目標價 800 美元;6 月股價站上 700 美元後,分析師開始辯論估值(Seeking Alpha 直言「好公司、但成長多已入價」)。7/20 收 715.67 美元、前瞻約 51 倍。Q2 財報預計 7 月底公佈,積壓與電力板塊利潤率是關鍵讀數。\n▸ 2026/9/25 更新:第二季(7/30)營收創紀錄 96 億美元、年增約 42%,調整後每股盈餘 4.24 美元創紀錄,自由現金流 9 億美元;總積壓訂單創新高 534 億美元。全年指引全面上修:營收 393 億至 397 億美元、調整後稅息折舊攤銷前利潤 40.9 億至 42.1 億美元、調整後每股盈餘 16.45 至 16.95 美元;並完成 Falcone、Interfab、Percheron、PSD 四項收購(約 12.4 億美元)擴充自有技工。股價 8 月一度逼近 789 美元,9/14 單日下跌 4.45%,目前約 650 美元,前瞻本益比約 39 倍。",
 en:"Q1 2026 (Apr 30) detonated: revenue of $7.87B (+26.3%) and adjusted EPS of $2.68 beat by 31%, with backlog at a record $48.5B; full-year guidance rose to $34.7–35.2B revenue and $13.55–14.25 adjusted EPS alongside a new $1B buyback — and the stock surged 17%+ the next day. Oppenheimer upgraded to Outperform in May with an $800 target; after shares crossed $700 in June, analysts began debating valuation (Seeking Alpha: 'great business, but much growth already priced in'). At $715.67 on Jul 20 it trades ~51x forward. Q2 results are due late July — backlog and Electric-segment margins are the key reads.\n▸ Update (Sep 25, 2026): Q2 (Jul 30) revenue hit a record $9.6B, up about 42%, adjusted earnings per share reached a record $4.24 and free cash flow was $0.9B; total backlog set a new high of $53.4B. Full year guidance was raised on every line: revenue of $39.3B to $39.7B, adjusted earnings before interest, taxes, depreciation and amortization of $4.09B to $4.21B, and adjusted earnings per share of $16.45 to $16.95; Quanta also closed four acquisitions (Falcone, Interfab, Percheron, PSD) for about $1.24B to add self performing craft labor. Shares neared $789 in August, fell 4.45% on Sep 14, and now trade around $650, about 39 times forward earnings."}]

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Trane Technologies 的前身是 1871 年創立的 Ingersoll-Rand,2020 年將工業業務分拆後,以旗下商用空調王牌品牌 Trane(1913)更名為純「氣候公司」,法定總部在愛爾蘭 Swords、營運中心在北卡 Davidson。三大區域板塊(美洲/EMEA/亞太)涵蓋:商用暖通空調(冰水主機、空氣處理、樓宇控制)、住宅空調,以及 Thermo King 運輸冷凍(冷鏈卡車與貨櫃)。美洲貢獻約八成營收,商用 HVAC 是絕對核心。",
 en:"Trane Technologies descends from Ingersoll-Rand (founded 1871); after spinning off its industrial businesses in 2020 it renamed itself around its flagship commercial-HVAC brand Trane (1913) as a pure climate company, legally domiciled in Swords, Ireland with operations in Davidson, NC. Three regional segments (Americas / EMEA / Asia Pacific) cover commercial HVAC (chillers, air handling, building controls), residential HVAC, and Thermo King transport refrigeration (cold-chain trucks and containers). The Americas contribute ~80% of revenue, with commercial HVAC the absolute core."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"商用 HVAC 是「設備+長尾服務」的經典組合:冰水主機一裝二十年,後續的保養、維修、能效改造與樓宇控制升級構成雙位數成長的服務年金(全球服務連年雙位數成長)。資料中心是新的成長主軸——大型冰水機組與 2026 年初收購的 Stellar Energy(模組化資料中心冷卻,一舉貢獻約 10 億美元積壓)讓 Trane 直接卡位機房外圍的冷卻鏈,與 Vertiv 的機房內液冷形成上下游互補。「Applied(應用型大型系統)」訂單連續三季成長逾 100%,是資料中心與製造業回流需求最直接的證據。",
 en:"Commercial HVAC is the classic equipment-plus-long-tail-services combination: a chiller runs for twenty years, and the maintenance, repair, efficiency retrofits and controls upgrades that follow form a double-digit-growth services annuity (global services have compounded at double digits). Data centers are the new growth axis — large chillers plus the early-2026 acquisition of Stellar Energy (modular data-center cooling, instantly adding ~$1B of backlog) position Trane in the cooling chain outside the data hall, complementing Vertiv's liquid cooling inside it. 'Applied' large-system bookings growing 100%+ for three straight quarters are the most direct evidence of data-center and reshoring demand."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在北美商用 HVAC 市場,Trane 與 Carrier、Johnson Controls(約克)、Daikin 四強鼎立,Trane 於大型商用與應用型系統居領導地位;Thermo King 與 Carrier 的 Transicold 則是運輸冷凍雙寡頭。相對 Carrier 偏住宅與全球分散,Trane 更集中於北美商用——這正是本輪資料中心與製造業回流資本支出的震央,也解釋其訂單動能領先同業。永續法規(冷媒轉換、建築能效)是長期順風;住宅與運輸冷凍短期仍疲弱,是組合中的拖累項。",
 en:"In North American commercial HVAC, Trane stands among the big four with Carrier, Johnson Controls (York) and Daikin, leading in large commercial and applied systems; Thermo King and Carrier's Transicold form the transport-refrigeration duopoly. Where Carrier skews residential and globally dispersed, Trane concentrates on North American commercial — the epicenter of this cycle's data-center and reshoring capex, which explains its sector-leading bookings momentum. Sustainability regulation (refrigerant transitions, building-efficiency codes) is the long-term tailwind; residential and transport refrigeration remain the near-term drags in the mix."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1(4/30 公佈)訂單全面引爆:整體有機訂單 +24%、美洲商用 HVAC 訂單創歷史新高(約 +40%)、Applied 訂單 +160%,book-to-bill 約 135%,積壓衝上創紀錄的 107 億美元(較年底 +30%);營收 49.7 億(+6%)、調整後 EPS 2.63 美元皆勝預期,全年指引上修至有機 +7%、EPS 14.75–14.95 美元。Stellar Energy 整合與關稅/通膨對利潤率的壓力是兩大觀察點(Q1 調整後營業利益率 -20bps)。股價 465.84 美元(7/20)、前瞻約 31 倍;Q2 財報預計 7 月底公佈。\n▸ 2026/9/25 更新:第二季(7/30)訂單創紀錄 78 億美元、年增 39%(有機 37%),營收 63.5 億美元、年增 11%,調整後每股盈餘 4.31 美元、年增 11%;積壓訂單創紀錄 121 億美元、年增 70%,其中約 60 億美元排在 2027 年以後。美洲商用暖通空調訂單年增 50% 創新高,Applied 大型系統訂單年增 130%,連續第四季翻倍以上,單季有四筆逾 1 億美元的訂單。全年調整後每股盈餘指引上修至 15.20 至 15.30 美元,下半年每股盈餘成長可望加速至約 23.5%。股價自夏季約 480 美元回落至約 437 美元;下次財報 11/4。",
 en:"Q1 2026 (Apr 30) was a bookings explosion: organic bookings +24%, Americas commercial-HVAC bookings at an all-time high (~+40%), applied bookings +160%, book-to-bill ~135%, and backlog at a record $10.7B (+30% vs year-end); revenue of $4.97B (+6%) and adjusted EPS of $2.63 both beat, with full-year guidance raised to ~7% organic growth and $14.75–14.95 EPS. The two watch items are Stellar Energy integration and tariff/inflation pressure on margins (Q1 adjusted operating margin -20bps). At $465.84 (Jul 20) the stock trades ~31x forward; Q2 results are due in late July.\n▸ Update (Sep 25, 2026): Q2 (Jul 30) bookings hit a record $7.8B, up 39% (37% organic), revenue of $6.35B rose 11% and adjusted earnings per share of $4.31 rose 11%; backlog reached a record $12.1B, up 70%, with about $6B scheduled for 2027 and beyond. Americas commercial heating, ventilation and air conditioning bookings rose 50% to an all time high and Applied bookings jumped 130%, a fourth straight quarter above 100%, including four orders above $100M each. Full year adjusted earnings per share guidance rose to $15.20 to $15.30, implying second half growth of about 23.5%. Shares have eased from about $480 in the summer to about $437. Next report: Nov 4."}]

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Symbotic 由美國最大食品批發商 C&S Wholesale 的掌門人 Rick Cohen 於 2007 年創立——源起是他想解決自家倉庫的效率問題,總部位於麻州 Wilmington,2022 年透過 SPAC 上市。核心產品是「AI 驅動的倉儲自動化系統」:自主移動機器人(Symbot)在多層鋼構中高速穿梭,配合視覺辨識與編排軟體,把配送中心的收貨、存取、堆疊、出貨全流程自動化。它是本庫第一家「純機器人」公司,填上自動化子行業的最後一塊拼圖。",
 en:"Symbotic was founded in 2007 by Rick Cohen, the owner of C&S Wholesale — America's largest food wholesaler — originally to fix his own warehouses' efficiency; headquartered in Wilmington, MA, it listed via SPAC in 2022. The core product is an AI-driven warehouse automation system: autonomous Symbot robots racing through multi-level steel structures, paired with machine vision and orchestration software to automate a distribution center's entire inbound-storage-palletizing-outbound flow. It is this KB's first pure robotics company, completing the automation sub-sector's final puzzle piece."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"模式是「巨型系統建置+終身軟體年金」:單一倉庫系統合約規模可達數千萬至上億美元,建置期數年認列收入(目前約九成營收),完工後轉入軟體維護與營運服務的經常性收入(佔比逐步提升)。227 億美元積壓約當十年營收,能見度冠絕本庫——但也高度綁定單一客戶:沃爾瑪承諾將其全美區域配送中心全面自動化,2025 年更直接把自家機器人部門賣給 Symbotic 並簽新協議,深度綁定同時也放大集中度風險。GreenBox(與軟銀合資)嘗試把系統變成「倉儲即服務」向中型客戶輸出。",
 en:"The model is mega-system deployment plus a lifetime software annuity: a single warehouse system can run tens of millions to $100M+, recognized over multi-year construction (now ~90% of revenue), then converting to recurring software maintenance and operation services (a rising mix). The $22.7B backlog — roughly ten years of revenue — gives the best visibility in this KB, but it is tightly bound to one customer: Walmart has committed to automating all its U.S. regional distribution centers, and in 2025 sold its own robotics unit to Symbotic under a new agreement — deepening the bond while magnifying concentration risk. GreenBox, the SoftBank JV, aims to repackage the system as warehouse-as-a-service for mid-size customers."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在「案例級」大型倉儲自動化領域,Symbotic 的部署規模(70 個據點)與積壓量居美國之冠,對手包括 AutoStore(挪威)、Dematic(KION 旗下)、Honeywell 智慧物流(將隨組合調整出售)與 Amazon 自研體系。相對 ATS(第 1 批)的多產業客製自動化,Symbotic 是單一產品、單一場景(零售配送中心)的極致專注派——爆發力與風險同樣極端。倉儲勞動力短缺與電商滲透是長期需求底盤;執行(部署速度、新一代儲存系統移轉)則是估值的生死線。",
 en:"In case-level, large-scale warehouse automation, Symbotic leads the U.S. in deployment scale (70 sites) and backlog, against AutoStore (Norway), Dematic (KION), Honeywell's intralogistics unit (being divested) and Amazon's in-house systems. Versus ATS (batch 1) with its multi-industry custom automation, Symbotic is the extreme specialist — one product, one setting (retail distribution centers) — with equally extreme upside and risk. Warehouse labor shortages and e-commerce penetration form the structural demand base; execution (deployment velocity, the next-gen storage-system migration) is the make-or-break line for the valuation."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"FY26Q2(3 月止,5 月初公佈)首度繳出 GAAP 獲利:營收 6.76 億美元(+23%)、淨利 900 萬、調整後 EBITDA 7,800 萬(年增逾一倍),積壓維持 227 億美元;但股價自 5 月初約 60 美元一路回落至 7/20 的 47.21 美元——市場焦點轉向積壓「停滯」、部署時程遞延與沃爾瑪依賴度(收購其機器人部門後集中度不降反升),Q1 財報後的失望情緒延續。多方(TD Cowen 目標 75 美元)看軟體年金與 GreenBox 打開第二曲線;空方緊盯自由現金流波動與新儲存技術移轉的執行風險。分析師平均目標價約 52.5 美元。\n▸ 2026/9/25 更新:第三財季(8/5)營收 7.21 億美元、年增 22%,依一般公認會計原則淨利 5,500 萬美元(去年同期虧損 2,100 萬),連續第二季獲利;調整後稅息折舊攤銷前利潤 9,500 萬美元、年增逾一倍,調整後毛利率 25%。軟體營收年增 57%、營運服務年增 49%,77 個系統部署中(56 個已營運)。但每股盈餘 0.09 美元低於預期的 0.13 美元,積壓訂單小降至 225 億美元,且未來 12 個月僅約 15% 可轉為營收,股價盤後下跌;9/1 觸及 52 週低點 37.68 美元,目前約 43.6 美元。Bain Capital 前共同主席 Steve Pagliuca 加入董事會;下次財報 11/16。",
 en:"FY26 Q2 (Mar-end, reported early May) delivered the first GAAP profit: revenue of $676M (+23%), net income of $9M, adjusted EBITDA of $78M (2x+ YoY), with backlog steady at $22.7B; yet the stock slid from ~$60 in early May to $47.21 by Jul 20 as attention shifted to a 'stalled' backlog, deployment-timing slips and Walmart dependence (which the robotics-unit acquisition deepened rather than diluted), extending post-Q1 disappointment. Bulls (TD Cowen, $75 target) see the software annuity and GreenBox opening a second curve; bears watch free-cash-flow volatility and next-gen storage-migration execution. The average analyst target sits near $52.5.\n▸ Update (Sep 25, 2026): Fiscal Q3 (Aug 5) revenue of $721M rose 22% and net income under generally accepted accounting principles was $55M (a $21M loss a year ago), a second straight profitable quarter; adjusted earnings before interest, taxes, depreciation and amortization more than doubled to $95M and adjusted gross margin reached 25%. Software revenue grew 57% and operation services 49%, with 77 systems in deployment (56 operational). But earnings per share of $0.09 missed the $0.13 consensus, backlog dipped to $22.5B with only about 15% converting in the next 12 months, and shares slid after hours; the stock touched a 52 week low of $37.68 on Sep 1 and now sits near $43.6. Former Bain Capital co chair Steve Pagliuca joined the board. Next report: Nov 16."}]
]

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Baker Hughes 在 2017 年由 GE 油氣事業與老牌油服公司 Baker Hughes 合併而成,前身可溯至 1907 年,總部位於休士頓與倫敦,與 SLB、Halliburton 並列全球三大油服公司。兩大板塊:油田服務與設備(鑽井、完井、油田化學與海底設備)以及工業與能源科技(燃氣渦輪、壓縮機、液化天然氣設備與數位解決方案)。執行長 Lorenzo Simonelli 近年推動能源科技轉型,2026 年 7 月完成收購 Chart Industries,同時出售 Waygate 等非核心業務。",
 en:"Baker Hughes took its current form in 2017, when GE's oil and gas business merged with the storied oilfield services firm Baker Hughes, whose roots reach back to 1907. Headquartered in Houston and London, it ranks with SLB and Halliburton among the big three oilfield service companies. It runs two segments: Oilfield Services and Equipment (drilling, completions, production chemicals, subsea) and Industrial and Energy Technology (gas turbines, compressors, liquefied natural gas equipment and digital solutions). Chief Executive Lorenzo Simonelli is steering an energy technology pivot, closing the Chart Industries acquisition in July 2026 while selling noncore units such as Waygate."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Baker Hughes 靠兩條腿走路:油田服務跟著上游資本支出循環起伏,工業與能源科技則是長週期設備加上數十年的售後服務。它繼承 GE 的航改型與工業燃氣渦輪技術(NovaLT、LM 系列),在液化天然氣廠的主冷劑壓縮機市佔全球領先;設備裝機後,維修、零件與升級帶來穩定的服務收入。人工智慧資料中心嚴重缺電,中小型燃氣渦輪成為「表後自建電廠」的熱門解方,讓這家油服公司也搭上了電力超級週期。",
 en:"Baker Hughes stands on two legs: oilfield services follow the upstream spending cycle, while Industrial and Energy Technology sells long cycle equipment followed by decades of aftermarket service. It inherited GE's aeroderivative and industrial gas turbine technology (NovaLT, LM series) and leads the world in main refrigerant compressors for liquefaction plants; once equipment is installed, maintenance, parts and upgrades generate steady service revenue. Power hungry artificial intelligence data centers have made small and midsize gas turbines a favored behind the meter solution, pulling an oilfield services company into the power supercycle."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在本庫「電力/能源設備」板塊中,Baker Hughes 與 GE Vernova 代表燃氣渦輪的兩種典型:GE Vernova 主攻電廠級重型機組,Baker Hughes 則以數十兆瓦級的航改型與工業燃氣渦輪切入資料中心與行動電源等分散式需求,交期較短是其優勢。液化天然氣設備方面,它是全球液化廠壓縮機組的主要供應商之一,直接受惠美國液化天然氣出口潮;油田服務端則面臨油價與中東局勢的循環逆風。",
 en:"Within this knowledge base's power shelf, Baker Hughes and GE Vernova illustrate two gas turbine archetypes: GE Vernova focuses on utility scale heavy duty units, while Baker Hughes targets distributed demand from data centers and mobile power with aeroderivative and industrial turbines in the tens of megawatts, where shorter lead times are an edge. In liquefied natural gas it is a leading supplier of liquefaction compressor trains and a direct beneficiary of the U.S. export boom; the oilfield services side faces cyclical headwinds from oil prices and Middle East conditions."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 年第二季(7/26)訂單 105 億美元、年增 49%,其中工業與能源科技訂單創紀錄 71 億美元、年增一倍,電力系統訂單 26 億美元(含 2.7 吉瓦燃氣渦輪,資料中心占 22 億美元),液化天然氣設備訂單 18 億美元;即使排除資料中心,該板塊訂單也追平前高。調整後稅息折舊攤銷前利潤 12.3 億美元、利潤率創紀錄 18.3%,自由現金流 11 億美元,並把 2026 至 2028 年板塊訂單目標提高到至少 450 億美元。9 月初上修全年營收與獲利區間並取得 Venture Global 液化天然氣合約,但股價自 9/9 約 63.6 美元回落至約 57.3 美元,距 52 週高點約低 19%。下次財報 10/22。",
 en:"Q2 2026 (Jul 26) orders reached $10.5B, up 49%, with record Industrial and Energy Technology orders of $7.1B, double a year earlier; Power Systems booked $2.6B including 2.7 gigawatts of gas turbines ($2.2B for data centers), and liquefied natural gas equipment added $1.8B. Even excluding data centers, segment orders matched the prior record. Adjusted earnings before interest, taxes, depreciation and amortization reached $1.23B at a record 18.3% margin, free cash flow was $1.1B, and the 2026 to 2028 segment order target rose to at least $45B. Early September brought a raised full year outlook and a Venture Global liquefied natural gas award, yet shares eased from about $63.6 on Sep 9 to about $57.3, roughly 19% below the 52 week high. Next report: Oct 22."}]
]

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Hubbell 由發明拉線燈座與插頭插座的 Harvey Hubbell 於 1888 年創立,總部位於康乃狄克州 Shelton,約 1.94 萬名員工。兩大板塊:公用事業解決方案(輸配電線路金具、絕緣子、電錶與先進讀表、變電站元件與電網自動化)以及電氣解決方案(工商業配線器材、連接器,以及資料中心與重工業用電氣零件)。",
 en:"Founded in 1888 by Harvey Hubbell, inventor of the pull chain lamp socket and the plug and receptacle, Hubbell is headquartered in Shelton, Connecticut, with about 19,400 employees. Its two segments are Utility Solutions (transmission and distribution line hardware, insulators, meters and advanced metering, substation components and grid automation) and Electrical Solutions (industrial and commercial wiring devices, connectors, and electrical components for data centers and heavy industry)."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Hubbell 賣的是電網上數以百萬計的「小東西」:每一根電桿上的金具、每一座變電站裡的連接器與開關。單價低但品類極多,公用事業客戶重視規格認證與可靠度,一旦進入材料清單就很少更換,形成黏性很高的汰換需求。電網老化更新、再生能源併網與資料中心負載成長,讓公用事業資本支出進入長期上升週期,Hubbell 則持續以併購擴充高成長品類。",
 en:"Hubbell sells the millions of small things that make up the grid: the hardware on every utility pole and the connectors and switches inside every substation. Individual items are cheap but the catalog is vast, and utility customers prize specifications and reliability, so once a part is on the bill of materials it rarely changes, creating sticky replacement demand. Aging grid replacement, renewable interconnection and data center load growth have put utility capital spending on a long upward path, and Hubbell keeps adding high growth product lines through acquisitions."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在北美公用事業輸配電零組件領域,Hubbell 是領導廠商之一,對手包括 Eaton、ABB、Preformed Line Products 與 MacLean Power;電氣解決方案則與 Eaton、Legrand、nVent 分食工商業市場。在本庫電力鏈中,它與 Quanta 形成「材料加施工」的互補:Quanta 派技工蓋電網,Hubbell 供應電網上的零件。相較 Eaton 偏向配電設備、Vertiv 偏向機房內,Hubbell 的曝險更集中在公用事業電網本身。",
 en:"Hubbell is a leading North American supplier of utility transmission and distribution components, competing with Eaton, ABB, Preformed Line Products and MacLean Power, while Electrical Solutions vies with Eaton, Legrand and nVent. In this knowledge base's power chain it pairs naturally with Quanta: Quanta's crews build the grid and Hubbell supplies the parts on it. Compared with Eaton's distribution equipment focus and Vertiv's position inside the data hall, Hubbell's exposure is concentrated on the utility grid itself."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 年第二季(7/28)營收 17.1 億美元、年增 15%(有機 10%),調整後每股盈餘 5.52 美元、年增 12%,優於預期;資料中心銷售年增約 65%,電網現代化與負載成長推升公用事業需求。不過調整後營業利益率 23.9%、年減 50 個基點,市場擔心通膨、擴產支出與併購槓桿壓縮利潤率,財報後股價走弱。全年調整後每股盈餘指引上修至 20.25 至 20.55 美元,並連續第 18 年調升股利。股價約 464 美元,距 52 週高點 565.5 美元約低 18%;下次財報 10/28。",
 en:"Q2 2026 (Jul 28) revenue of $1.71B rose 15% (10% organic) and adjusted earnings per share of $5.52 rose 12%, ahead of estimates; data center sales climbed about 65% while grid modernization and load growth lifted utility demand. Still, the adjusted operating margin slipped 50 basis points to 23.9%, and worries about inflation, capacity spending and acquisition leverage weighed on the shares after the print. Full year adjusted earnings per share guidance rose to $20.25 to $20.55, and the dividend has now risen 18 years in a row. At about $464 the stock sits roughly 18% below its 52 week high of $565.50. Next report: Oct 28."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Hammond Power Solutions 創立於 1917 年,總部位於安大略省 Guelph,是北美乾式變壓器的領導廠商,也生產鑄樹脂與液浸式配電變壓器、電抗器與電源品質產品,工廠遍布加拿大、美國、墨西哥與印度。公司由 Hammond 家族透過多重表決權股控制,在多倫多證交所交易的是 A 類股(HPS.A)。",
 en:"Founded in 1917 and headquartered in Guelph, Ontario, Hammond Power Solutions is a leading North American maker of dry type transformers that also produces cast resin and liquid filled distribution transformers, reactors and power quality products, with plants in Canada, the U.S., Mexico and India. The Hammond family controls the company through multiple voting shares; the Class A shares (HPS.A) trade on the Toronto Stock Exchange."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"變壓器是電力系統中最容易被忽略、卻最難快速擴產的設備:每一座資料中心、工廠與商業大樓都需要把中壓電降到可用電壓。Hammond 以標準品加客製設計的組合,透過配銷商與設備廠客戶銷售;近年把握北美變壓器短缺,大舉擴建美國與墨西哥產能,把長交期轉化為訂單能見度。2026 年收購 AEG Power Solutions,嘗試從單一元件延伸到關鍵電力系統與服務收入。",
 en:"Transformers are among the most overlooked yet hardest to scale pieces of the power system: every data center, factory and commercial building needs to step medium voltage down to usable levels. Hammond sells a mix of standard and custom designs through distributors and equipment makers, and has used the North American transformer shortage to expand U.S. and Mexican capacity, turning long lead times into order visibility. Its 2026 purchase of AEG Power Solutions extends the business from single components toward critical power systems and service revenue."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在北美乾式低中壓變壓器市場,Hammond 與 Eaton、施耐德(Square D)、Siemens 等大廠競爭,是少數專注變壓器的上市公司。它是本庫第四家加拿大公司,也是「利基冠軍」路線的最新例子:規模雖小,卻卡在資料中心與電網擴建最緊的瓶頸之一。美國市場貢獻約三分之二營收,資料中心已佔營收逾三成;加拿大本土市場則較疲弱、競爭加劇。",
 en:"In North American dry type low and medium voltage transformers, Hammond competes with giants such as Eaton, Schneider Electric (Square D) and Siemens, and is one of the few listed pure plays. As the fourth Canadian company in this knowledge base, it is the latest example of the niche champion path: small in scale, but sitting on one of the tightest bottlenecks in the data center and grid buildout. The U.S. contributes about two thirds of revenue and data centers now exceed 30% of sales, while the Canadian home market is softer and more competitive."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 年第二季(7/30)營收創紀錄 3.25 億加元、年增 44.7%,毛利率由第一季 30.1% 回升至 31.5%,調整後稅息折舊攤銷前利潤 5,300 萬加元、年增 59%,調整後每股盈餘 2.76 加元大幅優於預期;帳面每股盈餘僅 0.79 加元,主因股權激勵費用,營運現金流也為負值。積壓訂單仍比去年同期高 96.9%,季減 6.9% 主要反映出貨加速。股價 52 週區間從 111 加元飆升到 365 加元,波動極大;9/22 單日上漲 6.25%,9 月下旬約 267 加元。",
 en:"Q2 2026 (Jul 30) revenue hit a record C$325M, up 44.7%, gross margin recovered from 30.1% in Q1 to 31.5%, adjusted earnings before interest, taxes, depreciation and amortization rose 59% to C$53M, and adjusted earnings per share of C$2.76 beat estimates handily; reported earnings per share were only C$0.79 because of share based compensation, and operating cash flow was negative. Backlog remains 96.9% above last year, with the 6.9% sequential dip reflecting faster shipments. The 52 week range runs from C$111 to C$365, underscoring extreme volatility; the stock jumped 6.25% on Sep 22 and traded near C$267 in late September."}]
]

{zh:"Illinois Tool Works 創立於 1912 年,總部位於伊利諾州 Glenview,約 4.4 萬名員工,是美國最具代表性的多元工業公司之一。七大事業:汽車原廠零件、食品設備(Hobart)、測試量測與電子(Instron)、焊接(Miller)、聚合物與流體、建築產品(Paslode)與專業產品。多數產品是不起眼的扣件、耗材與設備,卻在各自利基市場名列前茅。",
 en:"Founded in 1912 and based in Glenview, Illinois, with about 44,000 employees, Illinois Tool Works is one of America's archetypal diversified industrials. Its seven businesses are Automotive original equipment components, Food Equipment (Hobart), Test and Measurement and Electronics (Instron), Welding (Miller), Polymers and Fluids, Construction Products (Paslode) and Specialty Products. Most products are unglamorous fasteners, consumables and equipment, yet they rank near the top of their niches."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"核心是「ITW 商業模式」:80/20 前後端流程(聚焦貢獻八成獲利的兩成客戶與產品,其餘大幅簡化)、以客戶為本的創新與高度分權的事業單位。它不追求規模,而是持續精簡產品線、提高每條線的獲利能力,營業利益率從十多年前約 15% 拉升到 26% 以上。穩定的自由現金流用於長期調升股利與大規模庫藏股,是「品質型複利股」的典型。",
 en:"The core is the ITW Business Model: the 80/20 Front to Back process (focus on the 20% of customers and products that generate 80% of profit and simplify the rest), customer back innovation and decentralized business units. Rather than chase scale, ITW keeps pruning product lines and raising profitability per line, lifting operating margin from roughly 15% more than a decade ago to above 26%. Strong free cash flow funds steady dividend increases and large buybacks, making it a classic quality compounder."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"它與 Parker-Hannifin 同為本庫多元工業的標竿,但路線不同:Parker 以併購擴張航太與過濾,ITW 則以內部營運系統為主、併購為輔,更強調有機成長與利潤率紀律。景氣曝險分散在汽車、餐飲、建築與電子等市場,單一市場波動影響有限;代價是整體有機成長偏低(過去多在低個位數),估值主要反映穩定性而非成長性。",
 en:"Alongside Parker-Hannifin it is this knowledge base's benchmark diversified industrial, but the paths differ: Parker grows through acquisitions in aerospace and filtration, while ITW relies primarily on its internal operating system with acquisitions in a supporting role, emphasizing organic growth and margin discipline. Exposure spreads across autos, food service, construction and electronics, so no single market dominates; the trade off is modest organic growth, historically in the low single digits, so the valuation mostly prices stability rather than growth."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 年第二季(7/28)營收 43 億美元、年增 6.1%,有機成長 4.5% 較上季加速,北美成長 6.4%;營業利益創紀錄 11.5 億美元,利潤率 26.7%,每股盈餘 2.84 美元、年增 10%,自由現金流年增 41%。焊接與測試量測電子事業有機成長雙位數。公司上修全年每股盈餘指引至約 11.45 美元,並在第二季提前以均價約 255 美元回購 7.5 億美元股票。財報後股價一度逼近 303 美元的 52 週高點,目前約 273 美元;管理層也暗示正常環境下 2027 年增量利潤率可望達 40% 以上。",
 en:"Q2 2026 (Jul 28) revenue of $4.30B rose 6.1%, organic growth accelerated to 4.5% and North America grew 6.4%; operating income reached a record $1.15B at a 26.7% margin, earnings per share of $2.84 rose 10%, and free cash flow jumped 41%. Welding and Test and Measurement and Electronics posted double digit organic growth. Management raised full year earnings per share guidance to about $11.45 and pulled forward $750M of buybacks at an average near $255. Shares approached the $303 52 week high after the report and now trade near $273; management also suggested 2027 incremental margins could exceed 40% in a normal environment."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Carrier 的歷史始於 1902 年 Willis Carrier 發明現代空調,1915 年創立公司,2020 年自聯合技術公司分拆上市,總部位於佛州 Palm Beach Gardens。執行長 David Gitlin 主導組合大改造:2024 年以約 130 億美元收購德國熱泵與暖氣龍頭 Viessmann Climate Solutions,並出售消防保全(Kidde)與商用冷凍業務,讓 Carrier 成為專注「氣候解決方案」的純暖通空調公司。",
 en:"Carrier traces its roots to Willis Carrier's 1902 invention of modern air conditioning; the company was founded in 1915 and spun off from United Technologies in 2020, with headquarters in Palm Beach Gardens, Florida. Chief Executive David Gitlin has remade the portfolio: in 2024 Carrier bought German heat pump and heating leader Viessmann Climate Solutions for roughly $13B and sold its fire and security (Kidde) and commercial refrigeration businesses, leaving a pure play climate solutions company."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Carrier 一半以上營收來自美洲,由住宅空調(經銷商體系)、輕型商用與大型商用冰水主機組成,另有 Carrier Transicold 運輸冷鏈。住宅業務受房市與冷媒轉換週期影響大,是近兩年的拖累;大型商用暖通空調與資料中心冷卻(冰水主機、機房空調與液冷整合)則是成長引擎。公司正推動「設備加售後服務與數位化」的經常性收入,並以收購 75F 補強智慧建築控制。",
 en:"More than half of revenue comes from the Americas, split among residential air conditioning (sold through dealers), light commercial and large commercial chillers, plus Carrier Transicold in transport refrigeration. Residential is highly sensitive to housing and refrigerant transition cycles and has been a drag for two years; large commercial heating, ventilation and air conditioning and data center cooling (chillers, computer room air handlers and liquid cooling integration) are the growth engines. Carrier is building recurring revenue from aftermarket service and digital offerings, adding smart building controls through the 75F acquisition."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在北美暖通空調市場,Carrier、Trane、Johnson Controls(York)、大金與 Lennox 並列主要玩家;Carrier 在住宅與輕型商用市佔領先,Trane 則在大型商用與 Applied 系統更強。本庫已收錄 Trane,Carrier 正好形成對照組:一邊是「住宅週期加資料中心成長」,一邊是「純商用成長」。同樣受惠資料中心散熱,Carrier 因住宅拖累,估值明顯較低。",
 en:"In North American heating, ventilation and air conditioning, Carrier, Trane, Johnson Controls (York), Daikin and Lennox are the main players; Carrier leads in residential and light commercial, while Trane is stronger in large commercial and applied systems. With Trane already in this knowledge base, Carrier provides the contrast between a residential cycle plus data center growth story and a pure commercial growth story: both benefit from data center cooling, but Carrier's residential drag leaves it on a much lower multiple."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 年第二季(7/28)營收 63.5 億美元、調整後每股盈餘 0.86 美元,雙雙優於預期;總訂單年增約 40%,商用暖通空調訂單年增 65%,資料中心訂單暴增逾 300%,積壓訂單突破 80 億美元。全年資料中心銷售指引上調至約 20 億美元,2027 年上看 30 億美元以上。但營業利益率年減約 1.8 個百分點,關稅與產品組合壓力讓股價在財報當天重挫約 9%;之後持續走弱,9 月下旬約 56.7 美元,接近 52 週低點 50.24 美元。瑞銀 9/21 給予買進評等,市場等待住宅需求觸底回升。",
 en:"Q2 2026 (Jul 28) revenue of $6.35B and adjusted earnings per share of $0.86 both beat estimates; total orders rose about 40%, commercial heating, ventilation and air conditioning orders 65% and data center orders more than 300%, pushing backlog above $8B. Full year data center sales guidance rose to about $2B, with more than $3B expected in 2027. Operating margin, however, fell about 1.8 points on tariffs and mix, and the stock dropped about 9% on results day; it has kept sliding to about $56.7 in late September, near the $50.24 52 week low. UBS rated it Buy on Sep 21 as investors wait for residential demand to bottom."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"United Rentals 創立於 1997 年,總部位於康乃狄克州 Stamford,是全球最大的設備租賃公司,擁有約 1,600 個據點、原始成本逾 200 億美元的設備機隊。產品從高空作業車、挖土機、發電機、臨時電力與溫控設備,到溝槽支撐與流體處理等專業設備,客戶涵蓋非住宅營建、工業維修與大型基礎建設專案。",
 en:"Founded in 1997 and headquartered in Stamford, Connecticut, United Rentals is the world's largest equipment rental company, with about 1,600 locations and a fleet worth more than $20B at original cost. Its equipment ranges from aerial work platforms, excavators and generators to temporary power, climate control, trench shoring and fluid solutions, serving nonresidential construction, industrial maintenance and large infrastructure projects."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"租賃的核心是「時間利用率乘以租金」:同一台設備可在不同工地重複出租,把客戶的資本支出變成營運支出。規模帶來三重優勢:向 Caterpillar、Deere 等原廠大量採購的議價力、密集據點網提升調度效率,以及為全國性大客戶提供一站式服務。設備使用數年後出售到二手市場回收資金,形成「買進、出租、出售」的循環;專業租賃(臨時電力、溫控、溝槽)毛利更高、成長更快,是近年重點。",
 en:"Rental economics come down to time utilization multiplied by rate: the same machine can be rented to job after job, turning customers' capital spending into operating expense. Scale brings three edges: purchasing power with manufacturers such as Caterpillar and Deere, a dense branch network that improves fleet logistics, and one stop service for national accounts. After several years of use, equipment is sold into the used market to recycle capital, completing a buy, rent, sell loop; specialty rentals (temporary power, climate control, trench) carry higher margins and faster growth and are the recent focus."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"北美設備租賃市場由 United Rentals、Sunbelt(Ashtead)與 Herc 三強主導,United Rentals 市佔第一且領先幅度明顯;產業仍高度分散,大廠持續以併購整合小型租賃商。它是本庫機械板塊中唯一的服務型公司,位在 Caterpillar 與 Deere 的下游:原廠把設備賣給租賃商,租賃商再把設備分時提供給工地。資料中心、半導體廠、液化天然氣與電網等大型專案,正是其專業租賃成長最快的來源。",
 en:"North American equipment rental is led by United Rentals, Sunbelt (Ashtead) and Herc, with United Rentals holding a clear lead in share, and the industry remains fragmented enough for continued consolidation. It is the only service business on this knowledge base's machinery shelf and sits downstream of Caterpillar and Deere: manufacturers sell to rental fleets, which then time share equipment to job sites. Data centers, semiconductor fabs, liquefied natural gas and grid megaprojects are the fastest growing sources of its specialty demand."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 年第二季(7/22)營收 44.1 億美元、年增 12%,租賃營收、稅息折舊攤銷前利潤與每股盈餘皆創同期紀錄:調整後每股盈餘 12.76 美元、年增 22%,調整後利潤率 46.6%,專業租賃營收年增 25%。受大型專案需求與設備時間利用率創新高帶動,全年營收指引上修 5 億美元至 175 億至 178 億美元,租賃資本支出也上調 4.5 億美元;標普將信評展望調為正向,有望升上投資等級。股價財報當天大漲約 13.5%,目前約 1,050 美元;下次財報 10/21。",
 en:"Q2 2026 (Jul 22) revenue of $4.41B rose 12%, with record Q2 rental revenue, earnings before interest, taxes, depreciation and amortization and earnings per share: adjusted earnings per share of $12.76 rose 22%, the adjusted margin hit 46.6%, and specialty rental revenue grew 25%. With megaproject demand and record time utilization, full year revenue guidance rose $500M to $17.5B to $17.8B and rental capital spending was lifted by $450M; S&P moved its credit outlook to positive, opening a path to investment grade. Shares jumped about 13.5% on the print and now trade near $1,050. Next report: Oct 21."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"TransDigm 由 Nicholas Howley 等人於 1993 年以槓桿收購起家,總部位於克里夫蘭,旗下擁有數十個獨立營運的航太零件事業,產品包括泵浦、閥門、點火系統、致動器、駕駛艙安全帶、機艙照明與各式專用零組件。約九成銷售來自專有設計零件,且多數為單一來源供應;2025 年 10 月由 Mike Lisman 接任執行長。",
 en:"TransDigm was built through a 1993 leveraged buyout led by Nicholas Howley and partners and is headquartered in Cleveland. It owns dozens of independently run aerospace component businesses making pumps, valves, ignition systems, actuators, cockpit safety restraints, cabin lighting and other specialized parts. About 90% of sales come from proprietary designs, most of them sole source; Mike Lisman became chief executive in October 2025."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"TransDigm 常被稱為「航太版私募股權」:只收購擁有專有智慧財產、以售後市場為主的零件事業,收購後依三項價值驅動因子經營:爭取新業務、嚴控成本、以價值定價。飛機零件一旦取得適航認證,航空公司幾乎無法更換供應商,而單一零件占整體維修成本比重極低,使 TransDigm 在售後市場擁有極強定價權,利潤率長期超過 50%。公司刻意維持約 5 至 6 倍的高槓桿,並以特別股利與庫藏股回饋股東。",
 en:"TransDigm is often called the private equity firm of aerospace: it buys only component businesses with proprietary intellectual property and heavy aftermarket exposure, then runs them on three value drivers: winning new business, tight cost control and value based pricing. Once a part is certified on an aircraft, airlines can hardly switch suppliers, and each part is a tiny share of total maintenance cost, giving TransDigm formidable aftermarket pricing power and margins that have long exceeded 50%. It deliberately runs leverage of roughly 5 to 6 times and returns capital through special dividends and buybacks."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在本庫航太板塊中,TransDigm 代表「零組件層」:在整機廠(波音、空巴)與引擎廠(GE Aerospace、RTX)之下,數以萬計的專有零件由它與 HEICO、Howmet、Parker 航太等供應。它的利潤率遠高於整機與引擎廠,原因正是售後市場的議價結構;但定價策略也曾引發美國國防部與國會對備品漲價的調查,是長期的政治風險。",
 en:"On this knowledge base's aerospace shelf, TransDigm represents the component layer: beneath airframers (Boeing, Airbus) and engine makers (GE Aerospace, RTX), tens of thousands of proprietary parts come from TransDigm, HEICO, Howmet and Parker's aerospace arm. Its margins dwarf those of airframers and engine makers precisely because of the aftermarket bargaining structure, though its pricing has also drawn Pentagon and congressional scrutiny over spare part price hikes, a lasting political risk."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 財年第三季(8/4)淨銷售 27.4 億美元、年增 23%(有機 13%),商用售後與商用原廠皆成長 17%、國防成長 11%,三個通路的訂單都超過出貨;調整後每股盈餘 10.87 美元、年增 13%,利潤率 52.8%(併購稀釋逾 2 個百分點)。全年銷售指引中值上調至 105.1 億美元、調整後每股盈餘中值 41.04 美元,自由現金流約 26 億美元;第三季以均價約 1,208 美元回購約 9.8 億美元股票。儘管基本面強勁,股價受高估值與內部人賣股影響,9/16 收 1,085 美元,接近 52 週低點。",
 en:"Fiscal Q3 2026 (Aug 4) net sales of $2.74B rose 23% (13% organic), with commercial aftermarket and commercial original equipment each up 17% and defense up 11%, and bookings outpaced shipments in all three channels; adjusted earnings per share of $10.87 rose 13% and the margin was 52.8% despite more than two points of acquisition dilution. The full year sales midpoint rose to $10.51B, adjusted earnings per share to a $41.04 midpoint and free cash flow to about $2.6B, and about $980M of stock was repurchased near $1,208. Despite strong fundamentals, valuation worries and insider selling left the shares at $1,085 on Sep 16, close to the 52 week low."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Howmet Aerospace 源自 1888 年的 Alcoa,2020 年由 Arconic 分拆而成,總部位於匹茲堡,由執行董事長兼執行長 John Plant 領軍。四大板塊:引擎產品(噴射引擎與工業燃氣渦輪用的單晶葉片與環件)、扣件系統(航太鈦合金扣件)、工程結構(鈦合金機體結構件)與鍛造輪圈(商用卡車鋁輪圈)。",
 en:"Howmet Aerospace descends from Alcoa (1888) and was separated from Arconic in 2020; it is headquartered in Pittsburgh and led by Executive Chairman and Chief Executive John Plant. Its four segments are Engine Products (single crystal airfoils and rings for jet engines and industrial gas turbines), Fastening Systems (aerospace titanium fasteners), Engineered Structures (titanium airframe structures) and Forged Wheels (aluminum wheels for commercial trucks)."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Howmet 最核心的是高溫合金精密鑄造:噴射引擎熱段的渦輪葉片必須承受超過金屬熔點的溫度,製程門檻極高,全球只有 Howmet 與波克夏旗下的 Precision Castparts 等少數廠商能大量供應。每具新引擎都需要葉片,引擎進廠大修時葉片也要更換,形成「原廠加售後」雙重需求;隨著 LEAP 與 GTF 等新一代引擎進入大修週期,備品需求快速成長。工業燃氣渦輪葉片則直接受惠資料中心發電熱潮。",
 en:"Howmet's crown jewel is superalloy precision casting: turbine blades in a jet engine's hot section must withstand temperatures above the metal's melting point, a process so demanding that only a handful of suppliers such as Howmet and Precision Castparts (owned by Berkshire Hathaway) can produce at scale. Every new engine needs blades, and blades are replaced again at overhaul, creating both original equipment and aftermarket demand; as LEAP and GTF engines enter heavy maintenance cycles, spares demand is climbing fast. Industrial gas turbine blades, meanwhile, ride the data center power boom."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在本庫航太板塊中,Howmet 與 TransDigm 同屬零組件層但互補:TransDigm 是品類龐雜的專有零件,Howmet 則是高度集中、資本密集的關鍵材料與製程。它向 GE Aerospace 與 RTX 旗下普惠等引擎廠供應葉片,燃氣渦輪葉片也供應 GE Vernova 等發電設備商,等於同時卡位航太與電力兩條主線。9 月 GE Aerospace 宣布收購鑄件廠 CPP,市場開始討論引擎廠垂直整合對 Howmet 議價能力的影響。",
 en:"On the aerospace shelf Howmet and TransDigm both sit in the component layer but complement each other: TransDigm offers a vast catalog of proprietary parts, while Howmet concentrates on capital intensive critical materials and processes. It supplies blades to engine makers such as GE Aerospace and RTX's Pratt and Whitney and gas turbine blades to power equipment makers such as GE Vernova, giving it a seat in both the aerospace and power themes. GE Aerospace's September deal to acquire casting supplier CPP has sparked debate about how engine maker vertical integration could affect Howmet's bargaining power."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 年第二季(8/6)營收 25.5 億美元、年增 24%(有機 21%),調整後每股盈餘 1.33 美元、年增 46%,調整後稅息折舊攤銷前利潤率 32.1%,營業利益率 27.9%,各項指標皆超越指引上緣;全年營收指引由 96.5 億上調至約 100.5 億美元、調整後每股盈餘中值 5.27 美元,成長來自飛機產量提升、備品需求與工業燃氣渦輪。財報時市值約 1,159 億美元,之後受 GE 收購 CPP 引發的競爭疑慮拖累,9/16 收 227.73 美元、距 52 週高點約低 27%;Guggenheim 9/14 以買進評等首次涵蓋。",
 en:"Q2 2026 (Aug 6) revenue of $2.55B rose 24% (21% organic), adjusted earnings per share of $1.33 rose 46%, the adjusted margin on earnings before interest, taxes, depreciation and amortization was 32.1% and operating margin 27.9%, all above the top of guidance; full year revenue guidance rose from $9.65B to about $10.05B with a $5.27 adjusted earnings per share midpoint, driven by higher aircraft build rates, spares and industrial gas turbines. The market value stood near $116B at the report, but competition worries after GE's CPP deal dragged shares to $227.73 on Sep 16, about 27% below the 52 week high; Guggenheim initiated at Buy on Sep 14."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Johnson Controls 的起點是 1883 年 Warren Johnson 取得電子室溫恆溫器專利,1885 年成立公司,開啟了樓宇控制產業;2016 年與 Tyco 合併後將法定總部設於愛爾蘭 Cork。2025 年把住宅與輕型商用暖通空調業務賣給 Bosch 後,成為專注商用建築的樓宇科技公司:York 冰水主機與 Applied 暖通空調、Metasys 樓宇自動化與 OpenBlue 數位平台、消防與保全系統,以及大量服務合約。2025 年上任的執行長 Joakim Weidemanis 正導入自有的經營系統。",
 en:"Johnson Controls began when Warren Johnson patented the electric room thermostat in 1883, founding the company in 1885 and launching the building controls industry; after merging with Tyco in 2016 it moved its legal domicile to Cork, Ireland. Having sold its residential and light commercial heating, ventilation and air conditioning business to Bosch in 2025, it is now a building technology company focused on commercial buildings: York chillers and applied systems, Metasys building automation and the OpenBlue digital platform, fire and security systems, and a large services book. Chief Executive Joakim Weidemanis, who took over in 2025, is rolling out a proprietary business system."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"營收分為「系統」(新建或改造工程的設備與整合)與「服務」(維護、維修與升級),服務占比高、黏性強,是穩定現金流的來源。它的差異化在於整合能力:從冰水主機、空調箱到控制系統與消防保全一次交付,再以 OpenBlue 軟體優化能耗。資料中心散熱是最大的成長引擎,大型 York 冰水主機與熱管理方案需求暴增,並投資 Accelsius 等晶片直接液冷新創,補齊機房內的液冷拼圖。",
 en:"Revenue splits into Systems (equipment and integration for new builds and retrofits) and Service (maintenance, repair and upgrades); the high share of sticky service revenue anchors cash flow. Its differentiation is integration: chillers, air handlers, controls, fire and security delivered as one package, with OpenBlue software optimizing energy use. Data center cooling is the biggest growth engine, with demand for large York chillers and thermal management surging, and investments in startups such as Accelsius (two phase direct to chip liquid cooling) fill in the liquid cooling piece inside the data hall."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在北美商用暖通空調與樓宇自動化市場,Johnson Controls 與 Trane、Carrier、Honeywell、Siemens 正面競爭。它被放在本庫的自動化板塊,是因為樓宇控制正是其技術源頭:與 Honeywell 的樓宇自動化直接對打,又與 Trane 在大型冰水主機、與 Vertiv 在資料中心散熱形成交集。與 Trane 相比,它過去的執行力較受質疑,但剝離住宅後組合更聚焦,積壓訂單的成長速度已追上甚至超越同業。",
 en:"In North American commercial heating, ventilation and air conditioning and building automation, Johnson Controls competes head to head with Trane, Carrier, Honeywell and Siemens. It sits on this knowledge base's automation shelf because building controls are its technological origin: it fights Honeywell's Building Automation directly while overlapping with Trane in large chillers and with Vertiv in data center cooling. Versus Trane, its execution drew more skepticism in the past, but after exiting residential the portfolio is sharper and backlog growth now matches or exceeds peers."}],

/* ---- SVG 長條圖 ---- */
function barSVG(rt,color){
  const w=380,h=200,pl=10,pr=10,pt=20,pb=26;
  const iw=w-pl-pr, ih=h-pt-pb;
  const max=Math.max.apply(null,rt.values)*1.18;
  const n=rt.values.length, slot=iw/n, bw=Math.min(52,slot*0.55);
  let s='<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg" role="img">';
  s+='<line x1="'+pl+'" y1="'+(h-pb)+'" x2="'+(w-pr)+'" y2="'+(h-pb)+'" stroke="#1B2530" stroke-width="1.2"/>';
  rt.values.forEach(function(v,i){
    const cx=pl+slot*(i+0.5), x=cx-bw/2;
    const bh=v/max*ih, y=h-pb-bh;
    const ap=rt.approx && rt.approx[i];
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" fill="'+color+'"'+(ap?' fill-opacity="0.5" stroke="'+color+'" stroke-dasharray="3 2"':'')+'/>';
    s+='<text x="'+cx+'" y="'+(y-6)+'" class="ch-val" text-anchor="middle">'+v+(ap?'*':'')+'</text>';
    s+='<text x="'+cx+'" y="'+(h-pb+16)+'" class="ch-lab" text-anchor="middle">'+esc(rt.labels[i])+'</text>';
  });
  s+='</svg>';
  return s;
}

/* ---- SVG 環圈圖 ---- */
const ALPHAS=["FF","C4","8E","5C","38","24"];
function donutHTML(seg,color){
  const r=52, C=2*Math.PI*r, cx=66, cy=66, sw=26;
  const total=seg.values.reduce(function(a,b){return a+b;},0);
  let off=0, s='<svg viewBox="0 0 132 132" class="donut-svg" role="img">';
  seg.values.forEach(function(v,i){
    const len=v/total*C, col=color+ALPHAS[i%ALPHAS.length];
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off+=len;
  });
  s+='</svg>';
  const lg='<ul class="legend">'+seg.labels.map(function(l,i){
    return '<li><span class="sw" style="background:'+color+ALPHAS[i%ALPHAS.length]+'"></span>'+esc(L(l))+'<span class="pc">'+seg.values[i]+'%</span></li>';
  }).join("")+'</ul>';
  return '<div class="donut-wrap">'+s+lg+'</div>';
}


/* ---- SVG 52 週區間量表 ---- */

  s+='<line x1="'+x1+'" y1="'+(ty-9)+'" x2="'+x1+'" y2="'+(ty+9)+'" stroke="#1B2530" stroke-width="1.5"/>';
  s+='<circle cx="'+px+'" cy="'+ty+'" r="7" fill="'+color+'" stroke="#FBFCFD" stroke-width="2"/>';
  s+='<text x="'+px+'" y="'+(ty-16)+'" class="ch-val" text-anchor="middle" style="font-size:13px">'+p.cur+'</text>';

  s+='<text x="'+x0+'" y="'+(ty+26)+'" class="ch-val" text-anchor="start">'+p.low+'</text>';

  s+='<text x="'+x1+'" y="'+(ty+26)+'" class="ch-val" text-anchor="end">'+p.high+'</text>';

/* ---- SVG 各批次紀錄價走勢 ---- */
function sparkSVG(ph,color){
  const w=560,h=170,pl=20,pr=20,pt=28,pb=32;
  const vals=ph.map(function(p){return p[1];});
  let mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
  const pad=((mx-mn)*0.18)||(mx*0.05)||1; mn-=pad; mx+=pad;
  const iw=w-pl-pr, ih=h-pt-pb, n=ph.length;
  function X(i){ return n>1? pl+iw*i/(n-1) : w/2; }
  function Y(v){ return pt+ih*(1-(v-mn)/(mx-mn)); }
  let s='<svg viewBox="0 0 '+w+' '+h+'" class="chart-svg" role="img">';
  if(n>1){ s+='<polyline fill="none" stroke="'+color+'" stroke-width="2" points="'+ph.map(function(p,i){return X(i).toFixed(1)+','+Y(p[1]).toFixed(1);}).join(' ')+'"/>'; }
  ph.forEach(function(p,i){
    const x=X(i), y=Y(p[1]);
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4" fill="'+color+'" stroke="#FBFCFD" stroke-width="1.5"/>';
    s+='<text x="'+x.toFixed(1)+'" y="'+(y-9).toFixed(1)+'" class="ch-val" text-anchor="middle">'+p[1]+'</text>';
    s+='<text x="'+x.toFixed(1)+'" y="'+(h-10)+'" class="ch-lab" text-anchor="middle">'+esc(String(p[0]).slice(2).replace(/-/g,"/"))+'</text>';
  });
  s+='</svg>';
  return s;
}

/* ---- 詳細頁 ---- */
function openDetail(id){
  const c = APP_DATA.companies.find(function(x){return x.id===id;});
  if(!c) return;
  openId = id;
  const s = SUB[c.subsector];
  const basics = c.basics.map(function(p){ return '<div class="b"><div class="k">'+esc(L(p[0]))+'</div><div class="v">'+esc(L(p[1]))+'</div></div>'; }).join("");
  const val = [[T("vPrice"),c.valuation.price],[T("vMcap"),c.valuation.mcap],[T("vPe"),c.valuation.pe],[T("vAsOf"),c.valuation.asOf]]
    .map(function(e){ return '<div class="b" style="border-left-color:'+s.color+'"><div class="k">'+esc(e[0])+'</div><div class="v">'+esc(L(e[1]))+'</div></div>'; }).join("");
  const fin = c.financials.map(function(r){ return '<tr><td class="k">'+esc(L(r[0]))+'</td><td class="v">'+esc(L(r[1]))+'</td></tr>'; }).join("");
  const secs = c.sections.map(function(sec,i){
    const ps = String(L(sec[1])).split(/\n+/).map(function(p){return '<p>'+esc(p)+'</p>';}).join("");
    return '<div class="sec-h"><span class="no" style="color:'+s.color+'">'+String(i+1).padStart(2,"0")+'</span><span class="t">'+esc(L(sec[0]))+'</span></div><div class="prose">'+ps+'</div>';
  }).join("");
  const chipTxt = LANG==="zh" ? (L(s.name)+' · '+s.en) : L(s.name);
  document.getElementById("panel").innerHTML =
    '<div class="p-head"><button class="close-btn" id="close" aria-label="close">✕</button>'
    +'<span class="tk">'+esc(c.ticker)+'<span class="ex">'+esc(c.exchange)+'</span></span>'
    +'<div style="margin-top:6px"><span class="chip" style="color:'+s.color+';border-color:'+s.color+'"><span class="sw" style="background:'+s.color+'"></span>'+esc(chipTxt)+'</span></div>'
    +'<div class="p-name">'+esc(L(c.name))+'</div><div class="p-tag">'+esc(L(c.tagline))+'</div></div>'
    +'<div class="basics">'+basics+'</div>'
    +'<div class="val">'+val+'</div>'
    +'<div class="p-body">'
    +((c.price52w||(c.priceHistory&&c.priceHistory.length>1))? '<div class="sec-h"><span class="no" style="color:'+s.color+'">§</span><span class="t">'+esc(T("priceSec"))+'</span></div>'
      +'<div class="ch-box">'
      +(c.price52w? '<div class="ch-cap">'+esc(T("rangeCap"))+'</div>'+rangeSVG(c.price52w,s.color) : '')
      +((c.priceHistory&&c.priceHistory.length>1)?'<div class="ch-cap" style="'+(c.price52w?'margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px':'')+'">'+esc(T("histCap"))+'</div>'+sparkSVG(c.priceHistory,s.color):'')
      +'</div>' : '')
    +'<div class="sec-h"><span class="no" style="color:'+s.color+'">§</span><span class="t">'+esc(T("finTitle"))+'</span></div>'
    +'<table class="fin-table">'+fin+'</table>'
    +'<div class="sec-h" style="margin-top:24px"><span class="no" style="color:'+s.color+'">§</span><span class="t">'+esc(T("chartsTitle"))+'</span></div>'
    +'<div class="charts">'
    +'<div class="ch-box"><div class="ch-cap">'+esc(T("revCap"))+' · '+esc(L(c.revTrend.unit))+'</div>'+barSVG(c.revTrend,s.color)+'<div class="ch-note">'+esc(L(c.revTrend.note)||"")+'</div></div>'
    +'<div class="ch-box"><div class="ch-cap">'+esc(L(c.segments.title))+'</div>'+donutHTML(c.segments,s.color)+'</div>'
    +'</div>'
    +secs
    +'</div>'
    +'<div class="p-foot"><span>'+esc(T("footBatch").replace("{b}",c.batch).replace("{d}",c.added))+'</span><span>'+esc(T("footVal"))+esc(L(c.valuation.asOf))+'</span><span>'+esc(T("footDisc"))+'</span></div>';
  const ov=document.getElementById("overlay");
  ov.classList.add("open"); document.body.classList.add("lock");
  document.getElementById("close").addEventListener("click",closeDetail);
  document.getElementById("close").focus();
}
function closeDetail(){ openId=null; document.getElementById("overlay").classList.remove("open"); document.body.classList.remove("lock"); }
document.getElementById("overlay").addEventListener("click",function(e){ if(e.target===this) closeDetail(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeDetail(); });

/* ---- 頁尾進度紀錄 ---- */
function renderFooter(){
  const byS = APP_DATA.subsectors.map(function(s){
    const arr=(PROGRESS.completed[s.id]||[]);
    return '<li><span class="mono" style="color:'+s.color+'">■</span> '+esc(L(s.name))+':<span class="mono"> '+(arr.length?arr.join(", "):"—")+'</span>('+arr.length+(LANG==="zh"?" 家":"")+')</li>';
  }).join("");
  const notes = PROGRESS.dataNotes.map(function(n){return '<li>'+esc(L(n))+'</li>';}).join("");
  const next = PROGRESS.nextSuggested.map(function(n){return '<span>'+esc(L(n))+'</span>';}).join("");
  document.getElementById("footer").innerHTML =
    '<div class="f-h">'+esc(T("logHead").replace("{b}",PROGRESS.batchesCompleted).replace("{n}",PROGRESS.totalCompanies).replace("{d}",PROGRESS.lastUpdated))+'</div>'
    +'<div class="f-grid">'
    +'<div class="f-box"><h4>'+esc(T("covered"))+'</h4><ul>'+byS+'</ul>'
    +'<h4 style="margin-top:14px">'+esc(T("next"))+'</h4><div class="next-chips">'+next+'</div></div>'
    +'<div class="f-box"><h4>'+esc(T("how"))+'</h4><div class="howto">'+esc(L(PROGRESS.howToContinue))+'</div>'+(PROGRESS.updateRoutine?'<div class="howto" style="margin-top:8px;border-top:1px dashed var(--line-soft);padding-top:8px">'+esc(L(PROGRESS.updateRoutine))+'</div>':'')
    +'<h4 style="margin-top:14px">'+esc(T("notes"))+'</h4><ul>'+notes+'</ul></div>'
    +'</div>'
    +'<div class="f-note">'+esc(T("fnote"))+'</div>';
}

/* ---- 語言切換 ---- */
function renderAll(){ renderChrome(); renderNav(); renderGrid(); renderFooter(); if(openId) openDetail(openId); }
document.getElementById("lang-btn").addEventListener("click",function(){ LANG = (LANG==="zh"?"en":"zh"); renderAll(); });

renderAll();
</script>
</body>
