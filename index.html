<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北美工業公司商業模式知識庫</title>
<style>
:root{
  --paper:#EDF0F3;
  --ink:#1B2530;
  --plate:#FAFBFC;
  --line:#C3CCD5;
  --line-soft:#DEE4EA;
  --muted:#5B6875;
  --c-power:#C1521B;
  --c-machinery:#96700D;
  --c-aerospace:#2C5C8F;
  --c-automation:#167265;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75}

/* ===== 工程圖紙外框 ===== */
.sheet{max-width:1150px;margin:18px auto;border:1px solid var(--ink);padding:4px;background:var(--paper)}
.sheet-inner{border:2px solid var(--ink);background:var(--plate)}
@media(max-width:640px){.sheet{margin:6px}}

/* ===== 標題欄(title block) ===== */
.titleblock{display:grid;grid-template-columns:1fr repeat(2,minmax(96px,140px));border-bottom:2px solid var(--ink)}
.tb-main{padding:20px 22px 16px;border-right:1px solid var(--ink);position:relative}
.lang-btn{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;border:1.5px solid var(--ink);background:var(--plate);color:var(--ink);padding:5px 11px;cursor:pointer}
.lang-btn:hover{background:var(--ink);color:var(--plate)}
@media(max-width:640px){.lang-btn{top:10px;right:10px}}
.tb-en{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.tb-title{font-size:24px;font-weight:800;letter-spacing:.06em;line-height:1.3}
.tb-sub{font-size:12px;color:var(--muted);margin-top:6px}
.tb-cell{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px 10px 7px;display:flex;flex-direction:column;justify-content:center}
.tb-cell:nth-child(odd){border-right:0}
.tb-cell .k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--muted)}
.tb-cell .v{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:2px}
.tb-grid{display:grid;grid-template-rows:1fr 1fr;grid-column:span 2;grid-template-columns:subgrid}
@media(max-width:640px){
  .titleblock{grid-template-columns:1fr}
  .tb-main{border-right:0;border-bottom:1px solid var(--ink)}
  .tb-grid{grid-template-columns:1fr 1fr}
  .tb-cell{border-right:1px solid var(--ink)}
  .tb-cell:nth-child(even){border-right:0}
}

/* ===== 導覽列:子行業籤 + 搜尋 ===== */
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--ink);background:var(--plate)}
.tab{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1.5px solid var(--ink);background:var(--plate);color:var(--ink);padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s,color .12s}
.tab .sw{width:9px;height:9px;border:1px solid var(--ink);display:inline-block}
.tab .ct{color:var(--muted);font-size:11px}
.tab.active{background:var(--ink);color:var(--plate)}
.tab.active .ct{color:var(--line)}
.tab:focus-visible,.card:focus-visible,.close-btn:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
.search{margin-left:auto;flex:0 1 240px;min-width:170px}
.search input{width:100%;font-family:var(--mono);font-size:13px;padding:7px 10px;border:1.5px solid var(--ink);background:var(--plate);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
@media(max-width:640px){.nav{padding:12px 12px}.search{flex:1 1 100%;margin-left:0}}

/* ===== 銘牌卡片格 ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;padding:20px 22px 26px}
@media(max-width:640px){.grid{padding:14px 12px 20px;gap:12px}}
.card{position:relative;border:1.5px solid var(--ink);background:var(--plate);padding:16px 16px 13px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:transform .12s,box-shadow .12s;
  background-image:
    radial-gradient(circle 2.6px at 9px 9px,var(--line) 2.2px,transparent 2.7px),
    radial-gradient(circle 2.6px at calc(100% - 9px) 9px,var(--line) 2.2px,transparent 2.7px),
    radial-gradient(circle 2.6px at 9px calc(100% - 9px),var(--line) 2.2px,transparent 2.7px),
    radial-gradient(circle 2.6px at calc(100% - 9px) calc(100% - 9px),var(--line) 2.2px,transparent 2.7px);}
.card:hover{transform:translateY(-2px);box-shadow:3px 3px 0 0 var(--ink)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tk{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:.05em}
.tk .ex{font-size:10px;font-weight:400;color:var(--muted);letter-spacing:.14em;display:block;margin-top:1px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border:1px solid;padding:3px 7px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip .sw{width:8px;height:8px;display:inline-block}
.card-name{font-size:16.5px;font-weight:700;margin-top:9px}
.card-tag{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6;min-height:40px}
.card-specs{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--line);margin-top:11px;padding-top:9px;gap:6px}
.spec .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted)}
.spec .v{font-family:var(--mono);font-size:13px;font-weight:700;margin-top:1px}
.empty{padding:40px 22px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}

/* ===== 詳細頁(overlay) ===== */
.overlay{position:fixed;inset:0;background:rgba(27,37,48,.55);display:none;z-index:50;overflow-y:auto;padding:26px 14px}
.overlay.open{display:block}
.panel{max-width:880px;margin:0 auto;background:var(--plate);border:2px solid var(--ink);animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}.card{transition:none}.tab{transition:none}}
.p-head{padding:20px 24px 16px;border-bottom:2px solid var(--ink);position:relative}
.p-head .tk{font-size:30px}
.close-btn{position:absolute;top:14px;right:14px;width:34px;height:34px;border:1.5px solid var(--ink);background:var(--plate);color:var(--ink);font-family:var(--mono);font-size:16px;cursor:pointer}
.close-btn:hover{background:var(--ink);color:var(--plate)}
.p-name{font-size:21px;font-weight:800;margin-top:8px}
.p-tag{font-size:13.5px;color:var(--muted);margin-top:4px}
.basics{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--ink)}
.basics .b{padding:10px 12px;border-right:1px solid var(--line)}
.basics .b:last-child{border-right:0}
.basics .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted)}
.basics .v{font-size:12.5px;font-weight:600;margin-top:3px;line-height:1.45}
@media(max-width:700px){.basics{grid-template-columns:repeat(2,1fr)}.basics .b{border-bottom:1px solid var(--line-soft)}}
.val{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--ink);background:#F2F5F7}
.val .b{padding:12px;border-right:1px solid var(--line);border-left:4px solid transparent}
.val .b:first-child{border-left-width:4px}
.val .b:last-child{border-right:0}
.val .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--muted)}
.val .v{font-family:var(--mono);font-size:15.5px;font-weight:800;margin-top:3px}
@media(max-width:700px){.val{grid-template-columns:repeat(2,1fr)}.val .b{border-bottom:1px solid var(--line-soft)}}
.p-body{padding:20px 24px 24px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.sec-h:first-child{margin-top:0}
.sec-h .no{font-family:var(--mono);font-size:12px;font-weight:800;letter-spacing:.1em}
.sec-h .t{font-size:16px;font-weight:800;letter-spacing:.05em}
.fin-table{width:100%;border-collapse:collapse;font-size:13.5px}
.fin-table td{padding:7px 4px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.fin-table td.k{color:var(--muted);width:44%}
.fin-table td.v{font-family:var(--mono);font-weight:700}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.charts{grid-template-columns:1fr}}
.ch-box{border:1px solid var(--ink);padding:12px}
.ch-cap{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.chart-svg{width:100%;height:auto;display:block}
.ch-val{font-family:var(--mono);font-size:10px;font-weight:700;fill:var(--ink)}
.ch-lab{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.ch-note{font-size:11px;color:var(--muted);margin-top:6px}
.donut-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut-svg{width:132px;height:132px;flex:0 0 auto}
.legend{list-style:none;flex:1;min-width:150px}
.legend li{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.legend .sw{width:10px;height:10px;flex:0 0 auto;border:1px solid rgba(27,37,48,.25)}
.legend .pc{font-family:var(--mono);font-weight:700;margin-left:auto}
.prose p{margin:0 0 10px;text-align:justify}
.p-foot{padding:12px 24px;border-top:1px solid var(--ink);font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:6px 18px}

/* ===== 頁尾:進度紀錄 ===== */
.footer{border-top:2px solid var(--ink);padding:20px 22px 24px;background:#F2F5F7}
.f-h{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:12px}
.f-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media(max-width:760px){.f-grid{grid-template-columns:1fr}}
.f-box{border:1px solid var(--ink);background:var(--plate);padding:14px 16px}
.f-box h4{font-size:13px;letter-spacing:.06em;margin-bottom:8px}
.f-box ul{list-style:none;font-size:12.5px}
.f-box li{padding:3px 0;border-bottom:1px dashed var(--line-soft)}
.f-box li:last-child{border-bottom:0}
.f-box .mono{font-family:var(--mono)}
.next-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.next-chips span{font-family:var(--mono);font-size:11px;border:1px dashed var(--ink);padding:3px 8px}
.howto{font-size:12.5px;line-height:1.8;color:var(--ink)}
.f-note{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:14px;letter-spacing:.04em}
body.lock{overflow:hidden}
</style>
</head>

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"GE Vernova 於 2024 年 4 月自通用電氣(GE)分拆獨立上市,總部位於麻州劍橋,是全球電力設備領域的純粹標的(pure-play)。旗下三大業務板塊:Power(燃氣、核能、水電、蒸汽發電設備與服務)、Wind(陸上與離岸風電)、Electrification(電網設備、變壓器、開關設備、HVDC 高壓直流輸電)。全球約有三分之一的電力由其設備發出,龐大的裝機基礎帶來深厚的服務收入長尾。",
 en:"GE Vernova was spun off from General Electric in April 2024 and is headquartered in Cambridge, Massachusetts — the pure-play name in global power equipment. It operates three segments: Power (gas, nuclear, hydro and steam generation equipment and services), Wind (onshore and offshore), and Electrification (grid equipment, transformers, switchgear, HVDC). Roughly one-third of the world's electricity is generated with its equipment, and that vast installed base feeds a deep, long tail of service revenue."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"典型的「大型設備+數十年服務」模式:以重型燃氣輪機、核電與電網設備等長週期資本財切入,再透過維護、升級、零件更換創造高毛利的經常性收入。關鍵指標是積壓訂單(backlog):2025 年全年訂單 593 億美元、營收 380 億美元,年底積壓訂單 1,500 億美元,為未來多年營收提供高度可見性。因燃氣輪機產能極度稀缺,公司採「產能席位預訂協議(slot reservation)」讓客戶預付訂金鎖定交付席位——這在資本財行業是罕見的定價權象徵。",
 en:"A classic 'big equipment + decades of services' model: heavy-duty gas turbines, nuclear and grid hardware are the long-cycle entry point, followed by high-margin recurring revenue from maintenance, upgrades and parts. The key metric is backlog: 2025 orders reached $59.3B against $38B of revenue, with year-end backlog at $150B — multi-year revenue visibility. With turbine capacity extremely scarce, the company sells 'slot reservation agreements', where customers pay deposits to lock in future delivery slots — a rare display of pricing power in capital goods."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"重型燃氣輪機領域與西門子能源、三菱重工形成全球三強寡占,GE Vernova 是美國市場的絕對龍頭,也是 AI 資料中心電力缺口的最大受益者之一。2026Q1 全板塊訂單有機成長 71%,燃機積壓+預訂席位達 100 GW(年底上看 110 GW);電氣化板塊訂單有機成長 86%,變壓器、開關設備供不應求,單位售價持續走升,管理層並預告 Q2 每 kW 報價將「非常健康地」成長。",
 en:"Heavy-duty gas turbines are a global three-player oligopoly with Siemens Energy and Mitsubishi Heavy Industries, and GE Vernova is the clear U.S. leader — one of the biggest beneficiaries of the AI data-center power gap. Q1 2026 orders grew 71% organically across all segments; turbine backlog plus slot reservations hit 100 GW (heading to 110 GW by year end). Electrification orders grew 86% organically, with transformers and switchgear in short supply and management guiding to 'very healthy' $/kW price growth in Q2."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 年 4 月公佈 Q1 財報並上調全年營收、EBITDA 利潤率與自由現金流指引:電氣化板塊單季獲得 24 億美元資料中心設備訂單,已超過 2025 全年;完成收購電網設備商 Prolec GE 剩餘 50% 股權,總積壓訂單達創紀錄的 1,630 億美元,管理層稱將提前達成 2,000 億美元目標。2030 年前燃機產能僅剩約 10 GW,已開始接受 2031 年之後的訂單;核電設備訂單與服務(含電廠升級大單)明顯上升。弱點在風電:受陸上風電量縮、關稅與離岸風電合約損失影響,板塊虧損擴大。\n▸ 2026/7/21 更新:Q2 財報 7/22 公佈,市場預期 EPS 3.17 美元、營收 107.7 億;7 月上旬股價曾單日重挫 10% 後迅速收復,52 週區間 530–1,196 美元展現高波動。\n▸ 2026/9/25 更新:第二季(7/22)訂單 242 億美元、年增 88%,積壓訂單增至 1,760 億美元;單季自由現金流 51 億美元已超過 2025 全年,全年自由現金流指引近乎倍增至 115 億至 125 億美元。但調整後每股盈餘 2.47 美元低於預期約 0.6 美元。上半年資料中心訂單逾 50 億美元(2025 全年約 20 億),管理層預期 2027 年初積壓訂單達 2,000 億美元。9 月與 Vineyard Wind 風場糾紛和解;股價自 7 月初高點 1,196 美元回落至約 946 美元。下次財報 10/27。",
 en:"In April 2026 the company reported Q1 results and raised full-year guidance for revenue, EBITDA margin and free cash flow: Electrification booked $2.4B of data-center equipment orders in a single quarter — more than all of 2025 — and the acquisition of the remaining 50% of grid-equipment maker Prolec GE closed, lifting total backlog to a record $163B; management says the $200B backlog target will be reached ahead of plan. Only ~10 GW of turbine capacity remains through 2030, with orders now being taken for 2031 and beyond; nuclear equipment orders and services (including large plant-upgrade awards) are rising sharply. The weak spot remains Wind, where losses widened on lower onshore volume, tariffs and offshore contract losses.\n▸ Update (Jul 21, 2026): Q2 results land Jul 22 (consensus EPS $3.17 on $10.77B revenue); the stock plunged 10% in a single early-July session before recovering — a 52-week range of $530–1,196 speaks to the volatility.\n▸ Update (Sep 25, 2026): Q2 (Jul 22) orders hit $24.2B, up 88%, lifting backlog to $176B; quarterly free cash flow of $5.1B already exceeded all of 2025, and full year free cash flow guidance nearly doubled to $11.5B to $12.5B. Adjusted earnings per share of $2.47, however, missed consensus by roughly $0.60. First half data center orders topped $5B (about $2B in all of 2025), and management expects backlog to reach $200B in early 2027. The Vineyard Wind dispute was settled in September; shares have eased from the early July high of $1,196 to about $946. Next report: Oct 27."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Caterpillar 創立於 1925 年,總部位於德州 Irving,是全球最大的工程機械與礦業設備製造商、道瓊工業指數成分股。三大設備板塊:建築產業(挖掘機、推土機、裝載機)、資源產業(大型礦車、電鏟)、能源與運輸(往復式引擎、發電機組、燃氣輪機、鐵路機車),外加金融服務部門 Cat Financial。黃色塗裝的 CAT 機械是全球基礎建設的代名詞。",
 en:"Founded in 1925 and headquartered in Irving, Texas, Caterpillar is the world's largest maker of construction and mining equipment and a Dow Jones Industrial Average component. Three equipment segments — Construction Industries (excavators, dozers, loaders), Resource Industries (large mining trucks, shovels) and Energy & Transportation (reciprocating engines, gensets, gas turbines, locomotives) — are complemented by Cat Financial. The yellow CAT machine is shorthand for global infrastructure."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"「經銷商網絡+設備銷售+售後服務+融資」四位一體:不直接賣給終端客戶,而是透過全球獨立經銷商體系銷售與服務,這張網絡是對手數十年難以複製的護城河;設備售出後的零件、維修與翻新(rebuild)貢獻穩定高毛利;Cat Financial 提供設備融資,黏住客戶並平滑景氣循環。近年最大的模式演變:能源與運輸板塊的大型往復式引擎與發電機組,正從備援電源轉型為資料中心「主要電源(prime power)」供應商,使公司從純景氣循環股逐漸帶上成長股色彩。",
 en:"A four-in-one model: dealer network + equipment sales + aftermarket + financing. Caterpillar does not sell directly to end users; a global network of independent dealers handles sales and service — a moat rivals have failed to replicate for decades. Parts, repairs and rebuilds deliver steady high-margin revenue after the sale, while Cat Financial finances purchases, deepening loyalty and smoothing the cycle. The biggest recent evolution: large reciprocating engines and gensets in Energy & Transportation are shifting from backup power to prime power for data centers, layering growth-stock character onto a classic cyclical."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"工程機械行業無可爭議的全球第一,領先小松(Komatsu)、迪爾、沃爾沃建築設備等對手。在 AI 電力缺口下,能源與電力板塊已成為公司最大且成長最快的部門(Q4'25 利潤年增 25%),大型燃氣發電機組與 Cummins、GE Vernova 形成既互補又競爭的格局;2026Q1 積壓訂單 630 億美元、年增 79%,並創下歷史最高的第一季訂單。",
 en:"The undisputed global No. 1 in construction machinery, ahead of Komatsu, Deere and Volvo CE. Amid the AI power gap, the power/energy business has become Caterpillar's largest and fastest-growing segment (Q4'25 profit +25%); its large gas gensets sit in a complementary-yet-competitive relationship with Cummins and GE Vernova. Q1 2026 backlog reached $63B, +79% YoY, alongside an all-time record for first-quarter orders."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1 營收 174 億美元(+22%)、調整後 EPS 5.54 美元(+30%),股價應聲創歷史新高。宣布與 ProPetro 旗下 PROPWR 簽訂至多 2.1 GW 大型燃氣發電機組框架協議——已是第六個超過 1 GW 的主要電源協議;全年營收指引上調至低雙位數成長,2030 年營收 CAGR 目標上調至 6–9%、發電業務銷售目標上調至 2024 年的 3 倍以上,並宣布大型往復式引擎產能擴張計畫。風險面:2026 全年關稅成本估 22–24 億美元,資源產業板塊利潤下滑 39%、利潤率掉約 700bps,是需持續追蹤的隱憂。\n▸ 2026/7/21 更新:股價 6/30 觸及 52 週高點 1,073 美元後回檔至約 870;7/7 宣布收購 Skycatch 強化礦業無人機測繪科技;Q1 發電營收年增 41% 至 28.2 億美元;Q2 財報 8/4 公佈。\n▸ 2026/9/25 更新:第二季(8/4)營收 205 億美元、年增 24%,單季首度突破 200 億美元;調整後每股盈餘 8.17 美元、年增 73%,大幅優於預期;積壓訂單創紀錄 720 億美元、年增 92%,約 59% 將在 12 個月內交付;全年營收成長指引上修至十幾個百分點的中高段。股價仍較 6/30 高點 1,073 美元低約 25%,市場在高估值下觀望人工智慧電力需求能否延續。下次財報約 10/29。",
 en:"Q1 2026 revenue was $17.4B (+22%) with adjusted EPS of $5.54 (+30%), sending the stock to record highs. A framework agreement with ProPetro's PROPWR unit covers up to 2.1 GW of large gas gensets — the sixth prime-power agreement of at least 1 GW. Full-year guidance was raised to low-double-digit growth; the 2030 revenue CAGR target rose to 6–9%, the power-generation sales target to more than 3x 2024 levels, and a major capacity expansion for large reciprocating engines was announced. Risks: FY2026 tariff costs of $2.2–2.4B, and Resource Industries profit fell 39% with margins down ~700bps — worth monitoring.\n▸ Update (Jul 21, 2026): the stock touched a 52-week high of $1,073 on Jun 30 before pulling back to ~$870; on Jul 7 CAT announced the Skycatch acquisition to bolster mining drone-mapping tech; Q1 power-generation revenue rose 41% to $2.82B; Q2 results land Aug 4.\n▸ Update (Sep 25, 2026): Q2 (Aug 4) sales reached $20.5B, up 24% and above $20B for the first time; adjusted earnings per share of $8.17 rose 73% and beat estimates by a wide margin; backlog hit a record $72B, up 92%, with about 59% due to ship within 12 months, and full year sales growth guidance was raised to the mid to high teens. Shares remain about 25% below the Jun 30 high of $1,073 as investors weigh a rich valuation against the durability of artificial intelligence power demand. Next report: around Oct 29."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"RTX(前身 Raytheon Technologies)由聯合技術(UTC)與雷神(Raytheon)於 2020 年合併而成,總部位於維吉尼亞州阿靈頓,全球員工逾 18 萬人,是營收規模最大的航太國防公司之一。三大事業部:Pratt & Whitney 普惠(飛機引擎)、Collins Aerospace 柯林斯(航空系統與航電)、Raytheon 雷神(飛彈與防空:愛國者、AMRAAM、戰斧、標準飛彈系列)。",
 en:"RTX (formerly Raytheon Technologies) was formed by the 2020 merger of United Technologies and Raytheon. Headquartered in Arlington, Virginia, with over 180,000 employees worldwide, it is one of the largest aerospace and defense companies by revenue. Three units: Pratt & Whitney (aircraft engines), Collins Aerospace (aircraft systems and avionics) and Raytheon (missiles and air defense: Patriot, AMRAAM, Tomahawk, the Standard Missile family)."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"「商用航空+國防」雙引擎。商用端是經典的剃刀與刀片:普惠 GTF 齒輪傳動渦扇引擎以微利甚至虧損售出,真正利潤來自其後 20–30 年的維修後市場(aftermarket);Collins 有 70% 產品品類居市場首位、裝機基礎達 1,050 億美元;GTF 引擎積壓 8,000 台。國防端為長週期政府合約,系統部署逾 50 國,受益於美國國防預算突破一兆美元與 NATO 數十年來最快的擴軍步伐;與五角大廈的長期彈藥框架協議提供七年期確定需求,支撐供應鏈投資。",
 en:"A dual engine of commercial aviation and defense. The commercial side is classic razor-and-blades: GTF geared turbofans are sold at thin or negative margins, with the real profit in 20–30 years of aftermarket service; Collins holds the No. 1 position in 70% of its portfolio with a $105B installed base, and the GTF backlog stands at 8,000 engines. Defense is long-cycle government contracting, with systems fielded in 50+ countries, benefiting from a $1T+ U.S. defense budget and NATO's fastest rearmament in decades; long-term munitions framework agreements with the Pentagon provide seven years of firm demand, underpinning supply-chain investment."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"與洛克希德·馬丁、波音、諾斯洛普·格魯曼並列美國國防四巨頭,但在防空與飛彈攔截(愛國者、標準飛彈、SM-3)幾乎沒有對等競爭者;商用引擎端普惠與 GE Aerospace/CFM 形成雙寡頭。2025 年營收 886 億美元(2021 年為 644 億),總積壓訂單由 2,680 億增至 2,710 億美元,規模與技術壁壘俱佳。",
 en:"One of America's Big Four defense primes alongside Lockheed Martin, Boeing and Northrop Grumman — yet in air and missile defense (Patriot, Standard Missile, SM-3) it has almost no peer competitor; in commercial engines Pratt forms a duopoly with GE Aerospace/CFM. Revenue reached $88.6B in 2025 (vs $64.4B in 2021) and total backlog grew from $268B to $271B — scale and technical barriers both intact."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1 調整後營收 221 億美元(+9%)、EPS 1.78 美元(+21%),三大板塊營收與利潤全面成長;Raytheon 有機成長 9%、營業利益率擴張 150bps 至 12.2%、彈藥產出年增逾 40%。隨即上修全年指引:營收 925–935 億、EPS 6.70–6.90 美元。涵蓋戰斧、AMRAAM 與標準飛彈家族的五項框架協議尚未計入積壓訂單,代表額外約十年的需求能見度。風險:約 8.5 億美元關稅利潤逆風未計入指引(Q1 Collins 已承受 130bps 拖累);GTF Advantage 需如期在 2026 年內投入服務,火箭發動機、鑄件與微電子供應鏈仍偏緊。\n▸ 2026/7/21 更新:7/7 與 NATO 推進 AMRAAM 產能大擴張、Stinger 飛彈產量將倍增;股價自 6 月下旬約 186 美元回升至約 194;Q2 財報 7/23 公佈。\n▸ 2026/9/25 更新:第二季(7/23)銷售 247 億美元、年增 14%(有機 16%),調整後每股盈餘 1.89 美元、年增 21%,大勝預期;積壓訂單創紀錄 2,890 億美元(商用 1,700 億、國防 1,190 億),雷神單季訂單出貨比 2.42。全年指引全面上修:調整後銷售 950 億至 960 億美元、調整後每股盈餘 7.10 至 7.25 美元、自由現金流 85 億至 87.5 億美元。股價 8 月初衝上 226.88 美元的 52 週高點後回落約 15%。下次財報 10/20。",
 en:"Q1 2026 adjusted revenue was $22.1B (+9%) and EPS $1.78 (+21%), with sales and profit growth across all three segments; Raytheon grew 9% organically, expanded margins 150bps to 12.2%, and lifted munitions output 40%+. Full-year guidance was promptly raised to $92.5–93.5B revenue and $6.70–6.90 EPS. Five framework agreements covering Tomahawk, AMRAAM and the Standard Missile family are not yet in backlog — roughly a decade of extra demand visibility. Risks: an ~$850M tariff profit headwind excluded from guidance (Collins absorbed a 130bps margin drag in Q1); GTF Advantage must enter service on schedule in 2026; rocket motors, castings and microelectronics remain tight.\n▸ Update (Jul 21, 2026): on Jul 7 RTX and NATO advanced a major AMRAAM capacity expansion and Raytheon is doubling Stinger output; the stock recovered from ~$186 in late June to ~$194; Q2 results land Jul 23.\n▸ Update (Sep 25, 2026): Q2 (Jul 23) sales of $24.7B rose 14% (16% organic) and adjusted earnings per share of $1.89 rose 21%, a clear beat; backlog reached a record $289B ($170B commercial, $119B defense), and Raytheon posted a 2.42 book to bill. Full year guidance was raised across the board: adjusted sales of $95B to $96B, adjusted earnings per share of $7.10 to $7.25 and free cash flow of $8.5B to $8.75B. Shares hit a 52 week high of $226.88 in early August before pulling back about 15%. Next report: Oct 20."}]
]

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Rockwell Automation 總部位於威斯康辛州密爾瓦基,源自 1903 年創立的 Allen-Bradley,是全球最大的「純工業自動化」上市公司。旗艦品牌 Allen-Bradley(PLC 可程式邏輯控制器)與 FactoryTalk(工業軟體)。三大板塊:智慧裝置(變頻器、馬達控制、感測與物料搬運)、軟體與控制(PLC、視覺化與數位孿生軟體)、生命週期服務(諮詢、維護、網路安全)。",
 en:"Headquartered in Milwaukee, Wisconsin, and tracing its roots to Allen-Bradley (founded 1903), Rockwell Automation is the world's largest pure-play industrial automation company. Flagship brands are Allen-Bradley (programmable logic controllers) and FactoryTalk (industrial software). Three segments: Intelligent Devices (drives, motor control, sensing, material handling), Software & Control (PLCs, visualization and digital-twin software) and Lifecycle Services (consulting, maintenance, cybersecurity)."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"核心是「安裝基礎的鎖定效應」:工廠一旦採用 Allen-Bradley 控制平台,整條產線的硬體、軟體與工程師技能都圍繞該生態系建立,轉換成本極高。公司正推動「硬體+軟體+年度經常性收入(ARR)」轉型,把一次性設備銷售升級為訂閱制軟體與服務(ARR 年增 6%);獲利結構上軟體與控制板塊利潤率最高(31%~35%),是整體利潤率上行的關鍵引擎。銷售透過獨立經銷商體系,北美通路密度為對手所不及。",
 en:"The core is installed-base lock-in: once a plant standardizes on the Allen-Bradley control platform, its hardware, software and engineering skills are all built around that ecosystem, making switching costs prohibitive. The company is driving a hardware + software + ARR transition, converting one-time equipment sales into subscription software and services (ARR +6% YoY); Software & Control carries the highest margins (31–35%) and is the key engine of margin expansion. Sales run through independent distributors, with North American channel density unmatched by rivals."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"北美離散自動化市場龍頭,全球與西門子、施耐德電機、ABB、三菱電機競爭。最大優勢是北美製造業回流(reshoring)的直接受益者——美國新建工廠優先採用本土 Rockwell 平台,2026 財年 Q2 美國有機銷售 +10%,管理層預期北美持續為最強區域。公司曾支援 NASA Artemis II 載人繞月任務的地面控制系統,是關鍵任務級可靠性的口碑背書。",
 en:"The leader in North American discrete automation, competing globally with Siemens, Schneider Electric, ABB and Mitsubishi Electric. Its biggest edge is being the direct beneficiary of U.S. reshoring — new American plants default to the home-grown Rockwell platform; U.S. organic sales rose 10% in FY26 Q2 and management expects North America to remain the strongest region. Rockwell also supported ground-control systems for NASA's Artemis II crewed lunar mission — a mission-critical reliability endorsement."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 財年 Q2 調整後 EPS 3.30 美元,大幅超越預期的 2.88,股價單日一度大漲近 10%。需求擴散至電商、倉儲自動化、資料中心與半導體;資料中心垂直年增逾一倍,客戶為求快速擴容與能源優化,正從商規轉向工業級控制設備。全年有機銷售指引上調至 +5~9%、企業營業利益率上調至 21.5%;完成 Sensia 合資解散,收回油氣流程自動化主導權;6 月再宣布 10 億美元庫藏股計畫,並規劃於威斯康辛州東南部興建多年來最大的新製造廠。留意下半年記憶體成本與供應商通膨的數千萬美元逆風,以及汽車、消費品大型資本支出仍因貿易波動延後。\n▸ 2026/7/21 更新:Citi 將目標價由 500 上調至 555 美元;獲核能新創 Aalo Atomics 選用其控制系統;威州 New Berlin 巨型新廠取得初步核准;Q3 財報 7/27 公佈。\n▸ 2026/9/25 更新:第三財季(8/4)銷售 23.1 億美元、年增 8%(有機 10%),調整後每股盈餘 3.49 美元、年增約 24%,優於預期;軟體與控制板塊利潤率 34.8%、提升 320 個基點,年度經常性收入年增 6%。全年指引上修:銷售成長 7.5% 至 9.5%、調整後每股盈餘 13.00 至 13.30 美元,動能來自資料中心、半導體與倉儲自動化。摩根士丹利目標價調升至 545 美元;股價約 433 美元,距 6 月高點約低 13%。第四財季財報約 11 月初。",
 en:"FY26 Q2 adjusted EPS of $3.30 crushed the $2.88 estimate and the stock jumped nearly 10% intraday. Demand is broadening across e-commerce, warehouse automation, data centers and semiconductors; the data-center vertical more than doubled YoY as customers shift from commercial-grade to industrial-grade controls for speed-to-capacity and energy optimization. Full-year organic growth guidance was raised to +5–9% with 21.5% op margin; the Sensia JV dissolution completed, returning oil & gas process automation in-house; in June the company announced a $1B buyback and plans for its largest new plant in years in southeast Wisconsin. Watch second-half headwinds from memory costs and supplier inflation (tens of millions of dollars), plus still-delayed auto and CPG capex.\n▸ Update (Jul 21, 2026): Citi raised its target from $500 to $555; nuclear startup Aalo Atomics selected Rockwell for control systems; the New Berlin, WI mega-plant won early approvals; Q3 results land Jul 27.\n▸ Update (Sep 25, 2026): Fiscal Q3 (Aug 4) sales of $2.31B rose 8% (10% organic) and adjusted earnings per share of $3.49 rose about 24%, ahead of estimates; the Software and Control margin reached 34.8%, up 320 basis points, and annual recurring revenue grew 6%. Full year guidance was raised to 7.5% to 9.5% sales growth and $13.00 to $13.30 adjusted earnings per share, powered by data centers, semiconductors and warehouse automation. Morgan Stanley lifted its target to $545; shares near $433 sit about 13% below the June high. Fiscal Q4 results arrive in early November."}]
]

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"ATS 創立於 1978 年,總部位於加拿大安大略省 Cambridge,於多倫多與紐約雙重上市,是加拿大工業科技的旗艦企業。全球約 40 個據點、員工約 7,500 人,提供整廠交鑰匙(turn-key)自動化製造系統、測試系統與整合控制方案,服務生命科學、運輸與移動、食品飲料、消費品、核能與能源等市場的跨國客戶。",
 en:"Founded in 1978 and headquartered in Cambridge, Ontario, ATS is dual-listed in Toronto and New York and is the flagship of Canadian industrial technology. With ~40 sites and ~7,500 employees worldwide, it delivers turn-key automated manufacturing systems, test systems and integrated controls to multinational customers across life sciences, transportation & mobility, food & beverage, consumer products, nuclear and energy."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"與販售標準化元件的 Rockwell 不同,ATS 是「客製化自動化系統整合商」:從零開始為客戶設計、建造並交付整條自動化產線,再以前期規劃(pre-automation)、售後服務與連網廠房管理軟體(擷取即時機台數據、預防停機、提升 OEE)延伸價值鏈。成長策略高度依賴併購擴張能力版圖;不配發股利,資金全數再投入成長、創新與收購。專案制收入波動較大,「訂單積壓+服務收入」提供能見度;生命科學(製藥、醫材組裝)的法規與驗證壁壘是最深護城河。",
 en:"Unlike component vendors such as Rockwell, ATS is a custom automation systems integrator: it designs, builds and delivers entire automated production lines from scratch, then extends the value chain with pre-automation planning, after-sales services and connected factory-floor software (real-time machine data, downtime prevention, OEE gains). Growth leans heavily on M&A to add capabilities; the company pays no dividend, reinvesting everything into growth, innovation and acquisitions. Project-based revenue is lumpy, so backlog plus services provide visibility; the regulatory and validation barriers of life sciences (pharma, medical devices) form the deepest moat."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在「客製化自動化系統整合」利基領域是全球規模最大的上市公司之一,生命科學自動化具深厚專業壁壘,並在電動車零組件與核能自動化累積實績。分析師普遍看好其高進入門檻與自動化製造的結構性需求,平均目標價約 C$49–52;2026 年以來股價跑贏多倫多綜合指數,反映行業結構性強勢而非大盤驅動。加拿大技術勞工短缺持續強化自動化的長期需求邏輯。",
 en:"In the custom automation integration niche it is among the largest listed players globally, with deep life-sciences expertise plus a track record in EV components and nuclear automation. Analysts broadly like the high barriers to entry and structural automation demand, with average targets around C$49–52; the stock has outperformed the TSX Composite in 2026 — sector-specific strength rather than market beta. Canada's skilled-labour shortage keeps reinforcing the long-term automation thesis."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"正經歷重大管理層更迭:CFO Ryan McLeod 於 2026 年 1 月宣布離職,CEO Andrew Hider 亦宣布將於 8 月底前卸任、轉赴自動化行業以外的新職(值得注意的是他 7 月 7 日仍以約 C$41.9 在公開市場加碼 3.8 萬股,過去一年淨買入約 C$170 萬)。FY2026(3 月止)營收年增 11%,並展開一系列改善利潤率、現金產生與資本效率的重組行動,為 FY2027 鋪路;但 FY2027 共識 EPS 由 C$1.62 下修至 C$1.38,近一週股價下跌 6.5% 至約 C$39,顯示市場對執行力仍持觀望。\n▸ 2026/7/21 更新:接班底定——新任 CEO Doug Wright 已上任(臨時 CFO 為 Anne Cybulski),策略聚焦利潤率擴張、紀律性併購與生命科學/核能優勢;FY2027 指引為溫和營收成長、利潤率擴張 50–75bps,訂單積壓約 20 億加元;Q1 財報 8/12 公佈。\n▸ 2026/9/25 更新:第一財季(8/6)營收 6.94 億加元、年減 5.8%,調整後每股盈餘 0.35 加元(去年同期 0.41);訂單 6.56 億加元、年減 5.3%(去年同期有大型核能訂單墊高基期),積壓訂單降至 18.9 億加元。新任執行長 Doug Wright 完成組合檢討,宣布 18 個月「固定成本轉型計畫」並重整運輸相關業務。財報當天股價單日重挫 26.5%,目前約 26.8 加元,接近 52 週低點;生命科學與食品飲料訂單仍在成長,是轉型能否奏效的觀察重點。",
 en:"A major leadership transition is underway: CFO Ryan McLeod announced his departure in January 2026, and CEO Andrew Hider will step down by end of August for a role outside automation (notably, he still bought ~38k shares at ~C$41.9 on July 7 and has been a net buyer of ~C$1.7M over the past year). FY2026 (March-end) revenue rose 11%, and a restructuring program targeting margins, cash generation and capital efficiency is underway ahead of FY2027; but FY2027 consensus EPS was cut from C$1.62 to C$1.38 and the stock fell 6.5% in a week to ~C$39 — the market remains in wait-and-see mode on execution.\n▸ Update (Jul 21, 2026): succession settled — new CEO Doug Wright has taken over (Anne Cybulski as interim CFO), focusing on margin expansion, disciplined M&A, and strengths in life sciences and nuclear; FY2027 guidance calls for modest revenue growth with 50–75bps of margin expansion on a ~C$2B order backlog; Q1 results land Aug 12.\n▸ Update (Sep 25, 2026): Fiscal Q1 (Aug 6) revenue of C$694M fell 5.8% and adjusted earnings per share were C$0.35 (C$0.41 a year ago); bookings of C$656M fell 5.3% against a prior year lifted by large nuclear awards, taking backlog down to C$1.89B. After completing his portfolio review, CEO Doug Wright launched an 18 month Fixed Cost Transformation Program and is restructuring the transportation businesses. The stock fell 26.5% on results day and now trades near C$26.8, close to its 52 week low; life sciences and food and beverage bookings still grew, the key signal for whether the turnaround works."}]
]
}

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Eaton(伊頓)創立於 1911 年,法定總部位於愛爾蘭都柏林、營運中心在美國俄亥俄州,是全球智慧電力管理(intelligent power management)龍頭。五大板塊:電氣美洲、電氣全球、航太、車輛與 eMobility,產品從配電設備、不斷電系統(UPS)、斷路器,到航太液壓與燃油系統。電氣業務貢獻約七成營收,是公司絕對核心;車輛板塊已規劃於 2027 年第一季前分拆,使 Eaton 更聚焦電氣化與航太。",
 en:"Founded in 1911, Eaton is legally domiciled in Dublin, Ireland, with its operational center in Ohio — the global leader in intelligent power management. Five segments: Electrical Americas, Electrical Global, Aerospace, Vehicle and eMobility, with products ranging from power distribution gear, UPS systems and circuit breakers to aerospace hydraulics and fuel systems. Electrical contributes roughly 70% of revenue and is the absolute core; the Vehicle business is slated for spin-off by Q1 2027, sharpening Eaton's focus on electrification and aerospace."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Eaton 賣的是「電力流動的每一個節點」:從電網變電、建築配電、資料中心供電到晶片端的散熱與電源品質,即所謂 grid-to-chip 全鏈路佈局。獲利模式結合大型專案設備銷售與龐大安裝基礎的更換/服務需求;電氣產品的規格認證與工程師指定習慣構成黏性。2026Q1 斥資 110 億美元收購 Boyd Thermal(液冷)與 Ultra PCS,補上 AI 資料中心散熱與電源品質拼圖,冷卻業務 2026 年營收上看 17 億美元;與 NVIDIA 合作開發固態變壓器,卡位下一代資料中心電力架構。",
 en:"Eaton sells every node of power flow: from grid substations, building distribution and data-center power to chip-level cooling and power quality — the 'grid-to-chip' full-chain play. The profit model combines large project equipment sales with replacement and service demand from a vast installed base; electrical spec-in certifications and engineer preferences create stickiness. In Q1 2026 it deployed $11B on Boyd Thermal (liquid cooling) and Ultra PCS, completing its AI data-center cooling and power-quality puzzle — the cooling business could reach $1.7B of 2026 revenue — while an NVIDIA collaboration on solid-state transformers positions it for next-gen data-center power architecture."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在中低壓配電與電力管理領域,Eaton 與 Schneider Electric、ABB、Siemens 並列全球四強,北美市佔尤其領先,是資料中心電力鏈的關鍵供應商。2026Q1 資料中心訂單暴增約 240%、營收成長約 50%;電氣板塊總積壓訂單年增 48%、滾動 book-to-bill 達 1.2。管理層估算美國在建資料中心容量 32 GW(約 70% 與 AI 相關),全行業資料中心待建規模 228 GW——相當於以 2025 年建設速度還要蓋 12 年,是對「AI 電力超級週期」最直觀的量化註腳。",
 en:"In low/medium-voltage distribution and power management, Eaton ranks among the global big four with Schneider Electric, ABB and Siemens, with particular strength in North America — a critical supplier in the data-center power chain. Q1 2026 data-center orders surged ~240% with revenue up ~50%; total Electrical backlog grew 48% YoY with a rolling book-to-bill of 1.2. Management estimates 32 GW of U.S. data-center capacity under construction (~70% AI-related) and a 228 GW industry pipeline — 12 years of building at 2025 rates, the most vivid quantification of the AI power supercycle."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1 營收 74.5 億美元(+17%)、調整後 EPS 2.81 美元皆創第一季紀錄,自由現金流年增 245%;全年有機成長指引由 8% 上調至 9–11%、調整後 EPS 上調至 13.05–13.50 美元。不過市場反應複雜:因投入成本與擴產費用,板塊利潤率年減 120bps 至 22.7%,Q2 EPS 指引亦略低於預期,財報後股價一度回檔;管理層強調 4 月已調漲售價,利潤率下半年將逐季回升。新 CEO Paulo Ruiz 上任後首個完整年度,執行力(整併 Boyd、產能爬坡、固態變壓器下半年接單)是 2026 下半年的觀察重點。\n▸ 2026/7/21 更新:7/8 任命 Dan Simpson 出任全球能源基礎設施方案總裁;股價自 6/22 的 52 週高點 436.7 美元回檔至約 402;Q2 財報 7/31 公佈。\n▸ 2026/9/25 更新:第二季(7/31)銷售創紀錄 85 億美元、年增 21%(有機 14%),調整後每股盈餘 3.15 美元創同期新高;資料中心訂單年增約 85%、營收年增約 65%,電氣積壓訂單年增 43%。全年指引上修:有機成長 11% 至 13%、調整後每股盈餘 13.40 至 13.60 美元。管理層估算美國資料中心待建容量達 307 吉瓦,相當於以 2025 年速度蓋 15 年,並投入 10 億美元推動 24 項擴產計畫;近期也與 Trane 合作推出人工智慧資料中心參考設計。股價由財報前約 387 美元升至約 438 美元。",
 en:"Q1 2026 revenue of $7.45B (+17%) and adjusted EPS of $2.81 were both first-quarter records, with free cash flow up 245%; full-year organic growth guidance was raised from 8% to 9–11% and adjusted EPS to $13.05–13.50. Yet the market's reaction was mixed: segment margins fell 120bps YoY to 22.7% on input costs and capacity ramp-up, Q2 EPS guidance came in slightly light, and the stock pulled back after the print; management stresses April price increases will rebuild margins through the year. In new CEO Paulo Ruiz's first full year, execution — integrating Boyd, ramping capacity, booking solid-state transformer orders in H2 — is the key watch item.\n▸ Update (Jul 21, 2026): Dan Simpson was named president of Global Energy Infrastructure Solutions on Jul 8; the stock has eased from its Jun 22 52-week high of $436.7 to ~$402; Q2 results land Jul 31.\n▸ Update (Sep 25, 2026): Q2 (Jul 31) sales hit a record $8.5B, up 21% (14% organic), with record Q2 adjusted earnings per share of $3.15; data center orders rose about 85% and revenue about 65%, and Electrical backlog grew 43%. Full year guidance rose to 11% to 13% organic growth and $13.40 to $13.60 adjusted earnings per share. Management now sizes the U.S. data center pipeline at 307 gigawatts, about 15 years of building at 2025 rates, and is investing $1B across 24 capacity projects; it also launched an artificial intelligence data center reference design with Trane. Shares climbed from about $387 before the print to roughly $438."}]
]

 en:"Founded in 1837 and headquartered in Moline, Illinois, Deere is the world's largest agricultural equipment maker — the green-and-yellow John Deere tractor is a cultural icon of American farming. Four segments: Production & Precision Agriculture (large tractors, combines), Small Agriculture & Turf, Construction & Forestry, and Financial Services (John Deere Financial). Like Caterpillar, Deere sells and services through a powerful independent dealer network, with its own captive finance arm funding equipment purchases."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Deere 的商業模式正從「賣鐵」走向「賣科技與訂閱」:See & Spray 精準噴灑技術已在 500 萬英畝農地運行,John Deere Operations Center 月活躍用戶近 44 萬,自動駕駛拖拉機與衛星導引構成 Solutions-as-a-Service 藍圖,目標把軟體與服務變成經常性收入。設備售後的零件與維修、金融服務的利差收入平滑了農業景氣循環;「提前訂購計畫(EOP)」讓產能與需求對齊、降低庫存風險。管理層並承諾未來十年投資 200 億美元於美國製造(美國銷售整機約 80% 於美國生產、約 75% 零件在地採購)。",
 en:"Deere's model is shifting from selling iron to selling technology and subscriptions: See & Spray precision spraying now runs on 5 million acres, the John Deere Operations Center has ~440,000 monthly active users, and autonomous tractors plus satellite guidance underpin a Solutions-as-a-Service roadmap turning software into recurring revenue. Aftermarket parts and service plus finance-arm spread income smooth the ag cycle, while Early Order Programs align production with demand and de-risk inventory. Management has committed $20B to U.S. manufacturing over the next decade (~80% of U.S. complete-goods sales are built in U.S. plants, ~75% of components sourced domestically)."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"農機領域無可爭議的全球第一,領先 CNH Industrial、AGCO、Kubota;在精準農業技術(自動駕駛、機器視覺)的軟硬整合上更是遙遙領先,構成「農業界的特斯拉+蘋果」式生態壁壘。營建設備位居北美前列,受惠基建與資料中心工程,美加訂單簿自去年 11 月以來成長逾 60%、全年產能檔期已排滿八成以上。CFO 明言 2026 財年是大型農機週期的谷底(大農機低於谷底水準、小農機接近循環中值、營建略高於中值),2027 年可望復甦。",
 en:"The undisputed global No. 1 in farm machinery, ahead of CNH Industrial, AGCO and Kubota — and far ahead in precision-ag software-hardware integration (autonomy, machine vision), an ecosystem moat akin to 'the Tesla-plus-Apple of agriculture.' Its construction equipment ranks among North America's leaders, benefiting from infrastructure and data-center work: U.S./Canada order books are up 60%+ since November with 80%+ of production slots filled. The CFO explicitly called FY2026 the bottom of the large-ag cycle (large ag below trough, small ag near mid-cycle, construction slightly above), with recovery expected in 2027."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 財年 Q2(4 月止)營收 133.7 億美元(+5%)、EPS 6.55 美元,連四季擊敗預期;美國最高法院裁定 IEEPA 關稅無效帶來 2.72 億美元退稅,推升設備營運利潤率至 16.9%。板塊分化鮮明:生產與精準農業 -14%(利潤率 15.7%),小型農業與草坪 +16%,營建與林業 +29% 成為最大亮點,全年營建銷售展望上調至約 +20%。全年淨利指引維持 45–50 億美元,關稅逆風全年仍達 12 億美元但不加徵附加費;另以 4.39 億美元收購營建科技公司 Tenna。市場焦點:2027 年大農機復甦的斜率,以及超低的新機+二手庫存能否轉化為訂價權。\n▸ 2026/7/21 更新:7/8 與 FTC 及五州就「維修權」達成和解,將開放維修軟體與工具;Citi 7/14 升評至持有、目標價 610 美元(Truist 看多至 812);Q3 財報 8/20 公佈。\n▸ 2026/9/25 更新:第三財季(8/20)營收 126.1 億美元、年增 5%,每股盈餘 5.10 美元,營收與獲利皆大幅優於預期;營建與小型農機持續強勁,大型農機仍疲弱。全年淨利指引下緣上調為 47.5 億至 50 億美元,設備營運現金流指引 50 億至 55 億美元,季配息調升至 1.62 美元。股價財報當天大漲約 9%,9 月下旬創下 52 週新高 721 美元,市場開始交易 2027 財年復甦;美國銀行目標價 715 美元。",
 en:"FY2026 Q2 (April-end) revenue was $13.37B (+5%) with EPS of $6.55 — a fourth straight beat; the Supreme Court's invalidation of IEEPA tariffs delivered a $272M refund, lifting equipment operating margin to 16.9%. Segment divergence was stark: Production & Precision Ag fell 14% (15.7% margin), Small Ag & Turf rose 16%, and Construction & Forestry surged 29% to become the standout, with FY construction sales guidance raised to ~+20%. Full-year net income guidance held at $4.5–5.0B; tariff headwinds remain $1.2B with no surcharges imposed; Deere also paid $439M for construction-tech firm Tenna. The market's focus: the slope of the 2027 large-ag recovery, and whether lean new-and-used inventories convert into pricing power.\n▸ Update (Jul 21, 2026): on Jul 8 Deere settled with the FTC and five states on right-to-repair, opening up repair software and tools; Citi upgraded to Hold on Jul 14 with a $610 target (Truist's bull case: $812); Q3 results land Aug 20.\n▸ Update (Sep 25, 2026): Fiscal Q3 (Aug 20) revenue of $12.61B rose 5% and earnings per share of $5.10 beat estimates on both lines, with construction and small agriculture strong while large agriculture stayed weak. The full year net income outlook was raised at the low end to $4.75B to $5.0B, equipment operations cash flow is guided at $5.0B to $5.5B, and the quarterly dividend rose to $1.62. Shares jumped about 9% on the print and set a 52 week high of $721 in late September as investors began pricing a fiscal 2027 recovery; Bank of America's target is $715."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Lockheed Martin(洛克希德·馬丁)由 Lockheed 與 Martin Marietta 於 1995 年合併而成(前身可溯至 1912 年),總部位於馬里蘭州 Bethesda,是全球營收最大的純國防承包商,美國政府貢獻約七成營收。四大板塊:航空(F-35、F-22、F-16)、飛彈與火控(PAC-3 愛國者、THAAD、HIMARS、JASSM/LRASM)、旋翼與任務系統(Sikorsky 黑鷹/CH-53K、神盾戰鬥系統)、太空(Orion 太空船、飛彈預警衛星、GPS)。",
 en:"Lockheed Martin was formed by the 1995 merger of Lockheed and Martin Marietta (roots to 1912) and is headquartered in Bethesda, Maryland — the world's largest pure-play defense contractor, with the U.S. government providing roughly 70% of revenue. Four segments: Aeronautics (F-35, F-22, F-16), Missiles & Fire Control (PAC-3 Patriot, THAAD, HIMARS, JASSM/LRASM), Rotary & Mission Systems (Sikorsky Black Hawk/CH-53K, the Aegis combat system) and Space (Orion spacecraft, missile-warning satellites, GPS)."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"商業模式是「平台壟斷+數十年生命週期」:F-35 是史上最大國防專案,規劃全球部署逾 3,000 架、生命週期價值上看數兆美元——賣飛機只是開端,其後數十年的升級(TR-3/Block 4、電戰系統)與維保才是長尾利潤。成本加成合約(cost-plus)提供穩定利潤,固定價格合約(fixed-price)則在通膨與供應鏈緊張時反噬利潤率,是近年虧損案(機密專案與部分固定價開發案)的根源。與五角大廈的多年期彈藥框架協議(PAC-3、THAAD、PrSM 產能目標 3–4 倍)正把「彈藥製造」變成成長業務。",
 en:"The model is 'platform monopoly + multi-decade lifecycle': the F-35 is history's largest defense program, with 3,000+ jets planned globally and a lifecycle value in the trillions — selling the jet is just the opening act, with decades of upgrades (TR-3/Block 4, electronic warfare) and sustainment providing the long-tail profit. Cost-plus contracts deliver stable margins, while fixed-price contracts bite during inflation and supply-chain stress — the root of recent losses on classified and some fixed-price development programs. Multi-year Pentagon munitions frameworks (PAC-3, THAAD, PrSM targeting 3–4x output) are turning munitions manufacturing into a growth business."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"以營收計是全球最大國防公司(2025 年 750.5 億美元),在第五代戰機領域近乎獨占(F-35 為西方唯一量產五代機),防空攔截彈(PAC-3、THAAD)供不應求,神盾系統與海軍作戰系統亦居壟斷地位。2025 年底積壓訂單創紀錄的 1,940 億美元、約 2.5 倍年營收,book-to-bill 1.2、連續四年成長;F-35 年交付量由 2024 年的 110 架躍升至 2025 年的 191 架。與 RTX 相比,LMT 是更純粹的「平台+彈藥」國防標的,幾乎沒有商用航空曝險,估值也因此更低(前瞻約 17 倍)。",
 en:"The world's largest defense company by revenue ($75.05B in 2025), with a near-monopoly in fifth-generation fighters (the F-35 is the West's only 5th-gen jet in mass production), sold-out air-defense interceptors (PAC-3, THAAD), and dominant positions in Aegis and naval combat systems. Year-end 2025 backlog hit a record $194B — about 2.5x annual revenue — with a 1.2 book-to-bill and four straight years of growth; F-35 deliveries jumped from 110 in 2024 to 191 in 2025. Versus RTX, LMT is the purer 'platforms + munitions' defense play with almost no commercial-aero exposure — and a lower multiple (~17x forward) to match."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1 表現失色:營收逾 180 億美元符合預期,但 EPS 6.44 美元不及預期(受 F-16 專案 1.25 億美元不利調整拖累),自由現金流為 -2.91 億美元,積壓訂單自年底的 1,940 億回落至 1,864 億,財報後股價下跌約 5%;全年指引維持營收 775–800 億、EPS 29.35–30.25、FCF 65–68 億美元。成長敘事仍在:5 月再獲 9.91 億美元 F-35 電戰升級合約,彈藥產能擴張與「金穹(Golden Dome)」飛彈防禦架構是潛在大單來源;Q2 財報於 7 月下旬公佈,將檢驗積壓訂單轉化與現金流回補進度。觀察重點:固定價格專案的利潤率修復與 F-35 Block 4 升級時程。\n▸ 2026/7/21 更新:7/2 獲 Citi 升評「買進」帶動股價單日大漲 4.6%;7/16 一舉拿下 105.3 億美元的 12 年期特戰司令部(USSOCOM)合約與 16 億美元海軍訂單;7/21 發表低成本攔截彈 PAC-3 ACE 與反無人機系統 MORFIUS,迎擊國防新創競爭;Q2 財報 7/23 公佈。\n▸ 2026/9/25 更新:第二季(7/23)銷售 200.6 億美元、年增 10.5%,每股盈餘 7.94 美元、優於預期約 10%,自由現金流由去年同期負值轉為 29 億美元;積壓訂單創紀錄 2,304 億美元、年增 640 億美元,訂單出貨比 3.2 倍,包含一筆 350 億美元的薩德(終端高空區域防禦)攔截彈多年期合約。全年銷售指引上修至中值 807.5 億美元、自由現金流 70 億至 72 億美元。股價財報後一度升至約 608 美元,目前回落至約 523 美元,前瞻本益比約 17.5 倍;9 月彭博報導中國扣留 F-35 敏感零件,供應鏈風險浮上檯面。",
 en:"Q1 2026 disappointed: revenue above $18B met expectations, but EPS of $6.44 missed (dragged by $125M of unfavorable F-16 adjustments), free cash flow was negative $291M, and backlog slipped from $194B at year-end to $186.4B — the stock fell ~5% on the print; full-year guidance was maintained at $77.5–80B revenue, $29.35–30.25 EPS and $6.5–6.8B FCF. The growth narrative persists: a $991M F-35 electronic-warfare upgrade award followed in May, and munitions capacity expansion plus the 'Golden Dome' missile-defense architecture are potential sources of major awards; Q2 results land in late July, testing backlog conversion and cash-flow recovery. Watch items: margin repair on fixed-price programs and the F-35 Block 4 timeline.\n▸ Update (Jul 21, 2026): a Citi upgrade to Buy on Jul 2 sent the stock up 4.6% in a day; on Jul 16 LMT landed a $10.53B, 12-year USSOCOM contract plus a $1.6B Navy order; on Jul 21 it unveiled the low-cost PAC-3 ACE interceptor and the MORFIUS counter-drone system to fend off defense startups; Q2 results land Jul 23.\n▸ Update (Sep 25, 2026): Q2 (Jul 23) sales of $20.06B rose 10.5% and earnings per share of $7.94 beat by about 10%, while free cash flow swung from negative a year ago to $2.9B; backlog hit a record $230.4B, up $64B, on a 3.2 book to bill that included a $35B multiyear Terminal High Altitude Area Defense interceptor contract. Full year sales guidance was raised to an $80.75B midpoint and free cash flow to $7.0B to $7.2B. Shares rallied to about $608 after the print but have eased to about $523, roughly 17.5 times 2026 earnings; in September Bloomberg reported China was holding sensitive F-35 parts, spotlighting supply chain risk."}]
]
},

{zh:"Emerson(艾默生)創立於 1890 年,總部位於密蘇里州聖路易,經過數年劇烈的組合重塑(出售 Copeland 壓縮機、剝離商用與住宅方案),已從多元工業集團蛻變為「純自動化」公司。業務橫跨流程自動化的量測儀表、閥門與最終控制(Fisher、Rosemount 等百年品牌)、控制系統(DeltaV)、離散自動化,以及軟體:2023 年併入 NI(國家儀器)強化測試量測,2025 年 3 月全資收購工業軟體龍頭 AspenTech,完成「硬體+軟體」雙平台架構。連續近 70 年調升股利,是著名的股利之王。",
 en:"Founded in 1890 and headquartered in St. Louis, Missouri, Emerson has transformed through years of radical portfolio surgery (selling Copeland compressors, exiting commercial & residential) from a diversified conglomerate into a pure-play automation company. It spans process-automation instrumentation, valves and final control (century-old brands like Fisher and Rosemount), control systems (DeltaV), discrete automation, and software: NI (National Instruments) was added in 2023 for test & measurement, and industrial-software leader AspenTech became wholly owned in March 2025, completing the hardware-plus-software twin-platform architecture. A famed Dividend King with nearly 70 straight years of increases."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Emerson 的商業模式建立在「流程工廠的神經系統」上:煉油、化工、LNG、製藥、電力工廠一旦採用 DeltaV 控制系統與 Rosemount 儀表,更換成本極高,後續的儀表校驗、閥門維修與軟體授權構成數十年黏性收入。策略主軸是「軟體定義自動化」:AspenTech 的模擬優化軟體疊加自家控制層,把一次性設備銷售轉化為訂閱制收入(軟體 ACV 16.4 億美元、年增 9%),並推出 AVA 等代理式 AI 顧問切入營運決策。獲利結構上,調整後板塊 EBITA 利潤率已達 27.6%,2028 年目標 30%、營收 210 億美元、EPS 上看 8 美元。",
 en:"Emerson's model is built on being the nervous system of process plants: once a refinery, chemical, LNG, pharma or power facility standardizes on DeltaV control and Rosemount instrumentation, switching costs are prohibitive, and decades of calibration, valve service and software licensing follow. The strategic thrust is software-defined automation: AspenTech's simulation-and-optimization software atop Emerson's control layer converts one-time equipment sales into subscription revenue (software ACV of $1.64B, +9% YoY), with agentic-AI advisors like AVA moving into operational decision support. Adjusted segment EBITA margin has reached 27.6%, with 2028 targets of 30% margins, $21B revenue and $8+ EPS."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在流程自動化(process automation)領域與 ABB、Siemens、Honeywell、Schneider(AVEVA)並列全球領導者,量測儀表與控制閥居世界第一梯隊,DeltaV 在化工與生技製藥產業市佔領先。相對 Rockwell 聚焦離散製造(工廠組裝線),Emerson 主場在流程工業(連續生產),兩者是北美自動化的一體兩面;LNG 出口潮、電力投資與生命科學擴產是終端市場順風。軟體端 AspenTech 在流程模擬近乎壟斷,使 Emerson 成為傳統自動化商中軟體含量最高者之一。",
 en:"In process automation Emerson ranks among the global leaders with ABB, Siemens, Honeywell and Schneider (AVEVA); its instrumentation and control valves sit in the world's top tier, and DeltaV leads in chemicals and life sciences. Where Rockwell focuses on discrete manufacturing (assembly lines), Emerson's home turf is process industries (continuous production) — the two are the twin faces of North American automation. LNG export waves, power investment and life-sciences expansion are end-market tailwinds; in software, AspenTech is near-monopolistic in process simulation, making Emerson one of the most software-rich traditional automation players."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 財年上半年穩健:Q1(12 月止)調整後 EPS 1.54 美元、年增 4%,調整後板塊 EBITA 利潤率 27.6%;Q2(3 月止)於 5 月初公佈,銷售與 EPS 續增並上調全年指引(全年營收成長約 5.5%、調整後 EPS 6.40–6.55 美元、自由現金流 35–36 億美元、庫藏股約 10 億美元)。3 月並發布 2028 年中期目標(營收 210 億、EBITA 利潤率 30%)。股價自 2026 年初高點一度回檔逾 20%,前瞻本益比由約 25 倍壓縮至 20–22 倍,市場辯論焦點在 AspenTech 整合成效與軟體利潤率兌現速度,分析師目標價分歧頗大(約 105–165 美元)。下一份財報(Q3)於 8 月 4 日公佈。\n▸ 2026/7/21 更新:Q2(3 月止)調整後 EPS 1.52 美元;近期獲 JPMorgan 升評,Citi 目標價 174 美元;股價自 3/30 的 52 週低點 122.6 美元回升至約 135。\n▸ 2026/9/25 更新:第三財季(8/4)銷售 48.7 億美元、年增 7%(基礎成長 6%),訂單年增 7%;調整後板塊息稅攤銷前利潤率 28.5%、提升 140 個基點,調整後每股盈餘 1.71 美元、年增 13%,高於指引上緣;自由現金流 13.2 億美元、年增 36%。測試量測與 Ovation 電力控制系統皆成長 23%,軟體年度合約價值增至 16.8 億美元。全年調整後每股盈餘指引上修至約 6.55 美元,全年將回饋股東約 22 億美元。股價 8/12 創 52 週高點 166.35 美元,目前約 154.55 美元。",
 en:"H1 FY2026 was steady: Q1 (Dec-end) adjusted EPS of $1.54 rose 4% with a 27.6% adjusted segment EBITA margin; Q2 (Mar-end), reported in early May, delivered further sales and EPS growth with raised full-year guidance (~5.5% revenue growth, $6.40–6.55 adjusted EPS, $3.5–3.6B free cash flow, ~$1.0B of buybacks). March brought 2028 mid-term targets ($21B revenue, 30% EBITA margin). The stock at one point fell 20%+ from its early-2026 peak, compressing the forward multiple from ~25x to 20–22x; the market debate centers on AspenTech integration payoff and the pace of software-margin delivery, with analyst targets ranging widely (~$105–165). The next report (Q3) lands August 4.\n▸ Update (Jul 21, 2026): FY26 Q2 (Mar-end) adjusted EPS was $1.52; JPMorgan recently upgraded the stock and Citi's target sits at $174; shares have recovered from the Mar 30 52-week low of $122.6 to ~$135.\n▸ Update (Sep 25, 2026): Fiscal Q3 (Aug 4) sales of $4.87B rose 7% (6% underlying) with orders up 7%; the adjusted segment margin on earnings before interest, taxes and amortization reached 28.5%, up 140 basis points, adjusted earnings per share of $1.71 rose 13% and topped guidance, and free cash flow jumped 36% to $1.32B. Test and Measurement and the Ovation power control business each grew 23%, and software annual contract value rose to $1.68B. Full year adjusted earnings per share guidance rose to about $6.55, with about $2.2B returned to shareholders. Shares set a 52 week high of $166.35 on Aug 12 and now sit near $154.55."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"CAE 創立於 1947 年,總部位於魁北克省蒙特婁,於多倫多與紐約雙重上市,是全球飛行模擬與訓練的絕對龍頭、加拿大航太皇冠上的明珠。兩大板塊:民航(飛行員、機艙與維修人員訓練,擁有全球最大的全動飛行模擬器 FFS 網絡與航校體系)與國防安全(軍機飛行員與任務訓練、模擬系統)。商業模式圍繞「模擬器製造+訓練服務」雙輪:自製並銷售 FFS 模擬器,同時經營全球訓練中心網絡收取訓練服務費。",
 en:"Founded in 1947 and headquartered in Montreal, Quebec, CAE is dual-listed in Toronto and New York — the undisputed global leader in flight simulation and training and a crown jewel of Canadian aerospace. Two segments: Civil Aviation (pilot, cabin and maintenance training, with the world's largest network of full-flight simulators and flight academies) and Defense & Security (military pilot and mission training, simulation systems). The model runs on twin wheels: building and selling FFS simulators while operating a global training-center network that charges for training services."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"CAE 的護城河來自法規與網絡效應的疊加:全球監管要求飛行員在「每一機型」上定期複訓,構成不受景氣影響的經常性需求底盤;航空公司自建模擬中心不符經濟效益,外包給規模與機型覆蓋最廣的 CAE 是自然選擇。訓練中心利用率(本年約 70%)與長約覆蓋率決定利潤;民航調整後積壓訂單 84 億加元、國防逾 110 億加元,合計約 195 億加元提供多年能見度。國防端受惠 NATO 各國軍費朝 GDP 5% 邁進,商機管線達現有國防積壓的數倍,多個潛在合約單筆規模逾十億加元。",
 en:"CAE's moat stacks regulation on network effects: global rules require recurrent training on every aircraft type a pilot flies, creating a recession-resistant recurring-demand base; airlines find in-house simulator centers uneconomic, making outsourcing to CAE — with unmatched scale and fleet-type coverage — the natural choice. Training-center utilization (~70% this year) and long-term contract coverage drive margins; Civil adjusted backlog of C$8.4B plus Defense above C$11B — roughly C$19.5B combined — provide multi-year visibility. Defense benefits from NATO budgets marching toward 5% of GDP, with an opportunity pipeline multiple times the current defense backlog and several potential contracts exceeding C$1B each."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在民航全動模擬器與第三方飛行訓練市場,CAE 市佔全球第一,領先 L3Harris 與 FlightSafety(波克夏旗下);在軍用飛行訓練外包領域亦居前列。作為知識庫第 2 批唯一的加拿大公司,它與 ATS 同樣體現「利基全球冠軍」路線:不與平台巨頭正面競爭,而是壟斷高進入門檻的訓練環節。波音與空巴積壓訂單長達數年、全球未來十年需新增數十萬名飛行員,是民航訓練的長期結構性需求;短期則受新機交付延遲、飛機停飛與中東衝突干擾。",
 en:"CAE holds the global No. 1 share in civil full-flight simulators and third-party pilot training, ahead of L3Harris and Berkshire-owned FlightSafety, and ranks among the leaders in outsourced military flight training. As the lone Canadian name in this batch, it mirrors ATS's 'niche global champion' path: rather than fighting platform giants head-on, it monopolizes the high-barrier training layer. Boeing and Airbus backlogs stretch years, and the world needs hundreds of thousands of new pilots over the next decade — the structural demand base for civil training; near term, delayed aircraft deliveries, groundings and the Middle East conflict are disruptions."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026 財年(3 月止)是轉型陣痛年:營收 49.1 億加元(+4.4%)但淨利 3.13 億、年減 23%;民航營收僅 +1%、板塊利潤率降至 18.6%,國防則量價齊揚(Q2 利潤率由 4.7% 升至 8.2%)。新任 CEO Matthew Bromberg(2025 年 8 月上任)推動八大工作流轉型:裁減 10% 商用模擬器機隊、整併不動產、組織由七個總裁縮編為二,目標年化節省 1.25–1.5 億加元、2028 年調整後板塊營業利益上看 9.5–10 億加元。5 月 22 日財報公佈當日股價大跌 9.3% 至約 24.4 美元,市場將 2027 財年定調為「重置年」;分析師平均評等仍為買進、目標價約 32.6 美元,賭的是國防上行週期與 2028 年後的轉型紅利。\n▸ 2026/7/21 更新:5 月與 Saab 擴大戰略合作,支援加拿大 AEW&C 空中預警機專案;6 月重啟正常程序庫藏股(NCIB);Q1 FY2027 財報 8/12 公佈。\n▸ 2026/9/25 更新:2027 財年第一季(8/12)營收 11.73 億加元、年增 6.8%,調整後每股盈餘 0.26 加元持平但優於預期;民航營收年增 5.6%,惟受中東衝突與成本上升拖累獲利,國防營收年增 8.3% 且利潤率持續擴張。自由現金流 1.04 億加元,淨負債對調整後稅息折舊攤銷前利潤比 2.27 倍,訂單出貨比 1.10;全年指引(調整後每股盈餘 1.21 至 1.28 加元)不變,1.25 億至 1.5 億加元的轉型節省目標按計畫推進。股價財報後自約 37.8 加元回落,目前約 34.6 加元;美國掛牌已改至那斯達克。下次財報約 11/11。",
 en:"FY2026 (March-end) was a year of transformation pains: revenue of C$4.91B (+4.4%) but net income of C$313M, down 23%; Civil revenue rose just 1% with segment margin sliding to 18.6%, while Defense delivered volume and margin gains (Q2 margin up from 4.7% to 8.2%). New CEO Matthew Bromberg (since August 2025) is driving an eight-workstream transformation: cutting 10% of the commercial simulator fleet, consolidating real estate, and collapsing seven president roles into two — targeting C$125–150M of annualized savings and C$950M–1B of adjusted segment operating income by 2028. The stock plunged 9.3% to ~US$24.4 on the May 22 report as the market framed FY2027 as a 'reset year'; the average analyst rating remains Buy with a ~US$32.6 target — a bet on the defense upcycle and post-2028 transformation dividends.\n▸ Update (Jul 21, 2026): in May CAE expanded its strategic partnership with Saab to support Canada's AEW&C program; in June it renewed its NCIB share buyback; Q1 FY2027 results land Aug 12.\n▸ Update (Sep 25, 2026): Fiscal 2027 Q1 (Aug 12) revenue of C$1.17B rose 6.8% and adjusted earnings per share held at C$0.26, still ahead of estimates; Civil revenue grew 5.6% but profitability slipped on Middle East disruption and higher costs, while Defense revenue rose 8.3% with further margin expansion. Free cash flow was C$104M, net debt to adjusted earnings before interest, taxes, depreciation and amortization was 2.27 times, and book to sales was 1.10; full year guidance (adjusted earnings per share of C$1.21 to C$1.28) was unchanged and C$125M to C$150M of transformation savings remain on track. Shares slipped from about C$37.8 before the report to about C$34.6; the U.S. listing is now on Nasdaq. Next report: around Nov 11."}]
]
}

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"創立於 1906 年的 Honeywell 曾是美國多元工業集團的代名詞,2026 年 6 月 29 日完成史詩級的三分拆:先進材料獨立為 Solstice(2025/10)、量子運算 Quantinuum 完成 IPO(2026/6)、航太業務獨立為 Honeywell Aerospace(NASDAQ: HONA),留下的 Honeywell Technologies(仍用 HON 代碼)成為純自動化公司,總部位於北卡 Charlotte。三大板塊:樓宇自動化、工業自動化、流程自動化與技術,年營收約 200 億美元,由主導整場改造的 Vimal Kapur 續任董事長兼 CEO。",
 en:"Founded in 1906, Honeywell was long the definition of the American industrial conglomerate. On June 29, 2026 it completed an epic three-way breakup: advanced materials became Solstice (Oct 2025), quantum unit Quantinuum IPO'd (Jun 2026), and aerospace spun off as Honeywell Aerospace (NASDAQ: HONA) — leaving Honeywell Technologies (still ticker HON) as a pure-play automation company headquartered in Charlotte, NC. Three segments — Building Automation, Industrial Automation, and Process Automation & Technology — generate roughly $20B of annual revenue, with transformation architect Vimal Kapur staying on as Chairman and CEO."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"新 HON 的敘事是「從自動化走向自主(automation to autonomy)」:憑藉全球最龐大的樓宇控制、感測器、流程控制安裝基礎之一,把數十年累積的設備數據轉化為軟體與 AI 服務收入。樓宇自動化賣的是大樓的神經系統(空調控制、消防保全、能源管理),工業自動化涵蓋感測、掃描與製程安全,流程自動化(前身 Honeywell Process Solutions)與 Emerson 的 DeltaV 在煉化廠控制室正面對決。分拆邏輯與 ROK/EMR 相同:讓自動化業務獲得純類股估值,並以聚焦的資本配置加速軟體化。",
 en:"The new HON's narrative is 'from automation to autonomy': leveraging one of the world's largest installed bases of building controls, sensors and process systems to convert decades of equipment data into software and AI service revenue. Building Automation sells the nervous system of buildings (HVAC controls, fire & security, energy management); Industrial Automation spans sensing, scanning and process safety; Process Automation (the former Honeywell Process Solutions) goes head-to-head with Emerson's DeltaV in refinery and chemical control rooms. The breakup logic mirrors ROK/EMR: give automation a pure-play multiple and accelerate softwareization with focused capital allocation."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"分拆後的 HON 一躍成為與 Rockwell、Emerson、Siemens、Schneider 同場競技的純自動化巨頭:樓宇自動化全球前二(對手 Johnson Controls、Siemens),流程自動化全球前三(對手 Emerson、ABB),工業感測與安全設備居第一梯隊。相對 ROK 偏離散製造、EMR 偏流程工業,HON 的獨特之處是「樓宇+工業+流程」三線並進,終端市場最分散;知識庫內自動化板塊至此集齊北美四大天王(ROK、EMR、HON、ATS),可作完整對照。",
 en:"Post-spin, HON instantly becomes a pure-play automation giant competing with Rockwell, Emerson, Siemens and Schneider: top-two globally in building automation (vs Johnson Controls, Siemens), top-three in process automation (vs Emerson, ABB), and first-tier in industrial sensing and safety. Where ROK skews discrete and EMR skews process, HON's distinction is fighting on three fronts — buildings, industrial and process — with the most diversified end markets. With this entry, the KB's automation shelf now holds North America's big four (ROK, EMR, HON, ATS) for full comparison."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1(分拆前)營收 91 億美元、有機 +2%,中東衝突干擾流程自動化收款與出貨;訂單 +7%、積壓升至 383 億美元,調整後 EPS 2.45 美元(+11%)。6/9 重申全年指引並首次給出分拆後展望:Honeywell Technologies 全年營收 199–202 億、調整後 EPS 3.95–4.15 美元;同時出售 PSS 與倉儲工作流方案完成最後瘦身。6/29 三分拆正式收官,HON、HONA 同日分開掛牌。分拆後股價與市值基期全變,本庫將於下批刷新確認;HONA(航太)亦列入未來新增候選。\n▸ 2026/9/25 更新:分拆後首份財報(7/23):不含航太的 Honeywell Technologies 訂單年增 16%,積壓訂單約 200 億美元,銷售 51.9 億美元、有機成長 4%,調整後每股盈餘 1.95 美元;樓宇自動化銷售年增 10%、利潤率 27.1%,工業自動化利潤率升至 17.2%。公司全面上修全年指引並首度公布至 2029 年的三年目標,另以 17.5 億美元收購 Johnson Matthey 觸媒技術事業(7/17 完成)。股價財報日大漲 6.45% 至約 248 美元後回落,9/23 收約 212.6 美元、市值約 674 億美元;52 週區間已按分拆調整。",
 en:"Pre-spin Q1 2026 revenue was $9.1B (+2% organic), with Middle East disruptions hitting Process Automation collections and shipments; orders rose 7%, backlog reached $38.3B, and adjusted EPS of $2.45 grew 11%. On June 9 the company reaffirmed guidance and gave its first post-spin outlook: Honeywell Technologies at $19.9–20.2B revenue and $3.95–4.15 adjusted EPS, while divesting PSS and Warehouse & Workflow Solutions as the final slimming step. The three-way breakup closed June 29 with HON and HONA trading separately the same day. Post-spin price and market-cap baselines have reset — this KB will confirm them next batch, and HONA (aerospace) joins the future-additions shortlist.\n▸ Update (Sep 25, 2026): In its first post spin report (Jul 23), Honeywell Technologies excluding Aerospace grew orders 16% to a backlog of about $20B, with sales of $5.19B (4% organic) and adjusted earnings per share of $1.95; Building Automation sales rose 10% at a 27.1% margin and Industrial Automation margin rose to 17.2%. Management raised full year guidance on every metric, unveiled three year targets through 2029, and closed the $1.75B purchase of Johnson Matthey's Catalyst Technologies on Jul 17. Shares jumped 6.45% to about $248 on the print before fading to about $212.6 by Sep 23, a market value near $67.4B; the 52 week range is spin adjusted."}]
]

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Northrop Grumman 由 Northrop 與 Grumman 於 1994 年合併而成,總部位於維州 Falls Church,約 9.5 萬名員工,是美國第三大國防承包商。四大板塊:航空系統(B-21、B-2 轟炸機、無人機)、任務系統(雷達、電戰、微電子)、太空系統(飛彈預警衛星、太空發展局星鏈、Sentinel 洲際飛彈)與防衛系統(武器與彈藥)。其標誌性的飛翼技術(B-2/B-21)與在雷達、太空領域的深厚積累,使它成為美國核威懾現代化的核心承包商。",
 en:"Formed by the 1994 merger of Northrop and Grumman and headquartered in Falls Church, Virginia with ~95,000 employees, Northrop Grumman is America's third-largest defense contractor. Four segments: Aeronautics Systems (B-21 and B-2 bombers, drones), Mission Systems (radar, electronic warfare, microelectronics), Space Systems (missile-warning satellites, SDA constellations, the Sentinel ICBM) and Defense Systems (weapons and munitions). Its signature flying-wing technology (B-2/B-21) and deep radar and space heritage make it the core contractor of America's nuclear-deterrent modernization."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"NOC 的模式是「押注下一世代平台的獨家地位」:B-21 Raider 是美軍未來唯一的戰略轟炸機(規劃逾百架),Sentinel 是陸基洲際飛彈汰換案(全案上看千億美元規模)——兩案皆為獨家承包,鎖定未來三十年收入。代價是開發期的固定價格風險:B-21 早期批次曾認列鉅額虧損,Sentinel 一度因超支重組;如今兩案先後轉正(Q1 與空軍達成 B-21 增產與 Sentinel 加速協議),風險曲線正從「吃虧的開發」走向「賺錢的量產」。任務系統的雷達與微電子則是高利潤率的隱形冠軍業務。",
 en:"NOC's model is a bet on sole-source positions in next-generation platforms: the B-21 Raider is the U.S. military's only future strategic bomber (100+ planned) and Sentinel is the land-based ICBM replacement (a program worth well over $100B) — both sole-source, locking in three decades of revenue. The price is fixed-price development risk: early B-21 lots booked heavy losses and Sentinel was restructured over cost overruns; both have since inflected (Q1 brought Air Force agreements to expand B-21 production and accelerate Sentinel), shifting the risk curve from money-losing development toward profitable production. Mission Systems' radar and microelectronics are the quiet high-margin champion underneath."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在戰略轟炸機與陸基核威懾領域,NOC 是無可替代的獨家玩家;太空防禦(飛彈預警與追蹤衛星)居領導地位,也是「金穹」飛彈防禦架構的關鍵候選承包商之一。與 LMT(戰機+防空飛彈)、RTX(引擎+攔截彈)相比,NOC 的組合最偏「核三位一體與太空」,對美國戰略預算的曝險最深。今晨公佈的 Q2 讓地位再進一步:單季獲單 200 億美元、book-to-bill 高達 1.84 倍,積壓 1,047 億美元約當 2.4 年營收,NATO 的 Triton 無人機與中東飛彈防禦需求則打開國際市場。",
 en:"In strategic bombers and land-based nuclear deterrence NOC is the irreplaceable sole player; it leads in space defense (missile-warning and tracking satellites) and is a key candidate contractor for the 'Golden Dome' missile-defense architecture. Versus LMT (fighters + air defense) and RTX (engines + interceptors), NOC's portfolio tilts hardest toward the nuclear triad and space, giving it the deepest exposure to U.S. strategic budgets. This morning's Q2 extended the lead: $20B of quarterly awards, a 1.84x book-to-bill, and a $104.7B backlog worth ~2.4 years of revenue, while NATO Triton drone and Middle East missile-defense demand open international markets."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026/7/21(今晨)公佈 Q2:營收 108.8 億美元(+5%)、EPS 7.68 美元大勝預期約 11%,積壓創紀錄 1,047 億美元(Sentinel 新增 76 億、機密專案 43 億);全年指引上修至營收 437.5–442.5 億、調整後 EPS 28.60–29.10 美元。但股價開盤反跌約 4% 至 501 美元——市場緊盯防衛系統 SiAW 與太空 GEM 63XL 的不利成本調整,以及「利多出盡」的估值消化;管理層承諾下半年利潤率改善。前瞻僅約 17 倍,與 LMT 同屬國防板塊的估值窪地,催化劑在 B-21 量產爬坡與金穹大單落地。\n▸ 2026/9/25 更新:7/21 財報日股價盤中一度跌至 479 美元,創 52 週低點;之後 8/3 取得約 30 億美元合約擴大飛彈防禦產能、9/3 再獲 8.63 億美元飛彈裝置合約,9/16 表示正就 8 項武器計畫進行積極討論。Guggenheim 9/14 以買進評等首次涵蓋,但 Bernstein 9/23 將目標價由 653 美元降至 620 美元。B-21 早期固定價格批次累計虧損約 20 億美元,仍是利潤率的主要疑慮。股價約 514 美元、年初至今下跌約 9%,近四季本益比約 16.7 倍,是本庫國防股中最便宜之一。下次財報約 10/20。",
 en:"Q2 landed this morning (Jul 21, 2026): revenue of $10.88B (+5%) and EPS of $7.68 beat by ~11%, with backlog at a record $104.7B (Sentinel +$7.6B, restricted +$4.3B); full-year guidance was raised to $43.75–44.25B revenue and $28.60–29.10 adjusted EPS. Yet the stock opened down ~4% to $501 — the market is watching unfavorable cost adjustments on Defense Systems' SiAW and Space's GEM 63XL, plus good-news-priced-in digestion; management promises H2 margin improvement. At ~17x forward it sits with LMT in defense's valuation trough, with catalysts in the B-21 production ramp and a potential Golden Dome award.\n▸ Update (Sep 25, 2026): On the Jul 21 results day the stock touched $479 intraday, its 52 week low. Since then Northrop won about $3B of contracts to expand missile defense production (Aug 3) and an $863M missile device award (Sep 3), and on Sep 16 said it is in active discussions on eight weapons programs. Guggenheim initiated at Buy on Sep 14, but Bernstein cut its target from $653 to $620 on Sep 23. Cumulative losses of roughly $2B on early fixed price B-21 lots remain the main margin concern. At about $514 the shares are down about 9% year to date and trade near 16.7 times trailing earnings, among the cheapest defense names here. Next report: around Oct 20."}]
]

{zh:"Cummins 創立於 1919 年,總部位於印第安納州 Columbus,是全球最大的獨立引擎製造商,約七萬名員工。五大板塊:引擎(重型/中型卡車與越野柴油引擎)、零組件(渦輪、濾清、排放後處理)、配銷(全球銷售與服務網)、電力系統(發電機組與高馬力引擎)與 Accelera(電池電動與氫能)。客戶涵蓋 PACCAR、Daimler Truck、Stellantis 等整車廠——Cummins 是「賣引擎給所有人」的中立軍火商。",
 en:"Founded in 1919 and headquartered in Columbus, Indiana, Cummins is the world's largest independent engine maker with ~70,000 employees. Five segments: Engine (heavy/medium-duty truck and off-highway diesels), Components (turbos, filtration, aftertreatment), Distribution (global sales and service), Power Systems (generator sets and high-horsepower engines) and Accelera (battery-electric and hydrogen). Customers span PACCAR, Daimler Truck, Stellantis and more — Cummins is the neutral arms dealer that sells engines to everyone."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"傳統上 Cummins 是「北美卡車週期」的同義詞:引擎隨 Class 8 卡車景氣大起大落,靠龐大的零件與服務後市場平滑週期。但 2026 年的敘事已改寫——資料中心備援與主力電源需求引爆 Power Systems:Q1 營收創紀錄 19.6 億美元、EBITDA 利潤率 29.5%,以 23% 的營收貢獻近四成獲利,成為全公司利潤率最高的板塊。公司押注雙引擎:2027 年 EPA 新規帶動的卡車換購潮(X15/X10 新平台),與資料中心電力的長期結構性需求(4MW 天然氣引擎、Circe 2GW 協議)。",
 en:"Cummins was traditionally synonymous with the North American truck cycle: engines rose and fell with Class 8 demand, smoothed by a vast parts-and-service aftermarket. The 2026 narrative has been rewritten — data-center backup and prime power demand has ignited Power Systems: record Q1 revenue of $1.96B at a 29.5% EBITDA margin, contributing nearly 40% of profit on 23% of revenue, the company's most profitable segment. The bet is on twin engines: the EPA-2027-driven truck replacement wave (new X15/X10 platforms) and the structural long-term demand of data-center power (the 4MW gas engine, the ~2GW Circe deal)."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在中重型柴油引擎領域,Cummins 是全球市佔第一的獨立供應商;發電機組與高馬力引擎則與 Caterpillar、Rolls-Royce Power Systems(MTU)、Generac 同場競逐資料中心備援電力這塊爆發市場——與知識庫內的 CAT 形成最直接的對照組(CAT Q1 發電營收 +41%,CMI 北美發電 +23%)。在零排放轉型上,Accelera 經歷戰略收縮(出售低壓燃料電池、認列 1.99 億美元重組),反映全行業對氫能節奏的重新校準;短期護城河仍是柴油與天然氣的規模經濟。",
 en:"In medium/heavy-duty diesel, Cummins is the world's No. 1 independent supplier; in gensets and high-horsepower engines it battles Caterpillar, Rolls-Royce Power Systems (MTU) and Generac for the exploding data-center backup market — making it the most direct comp to CAT in this KB (CAT Q1 power-gen revenue +41%, CMI NA power gen +23%). In zero-emissions, Accelera has strategically retrenched (selling low-pressure fuel cells with a $199M charge), reflecting an industry-wide recalibration of the hydrogen timeline; the near-term moat remains diesel and natural-gas scale economics."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1(5/5 公佈)營收 84 億美元(+3%)、調整後 EPS 6.15 美元勝預期近 10%,並上修全年:營收 +8–11%、Power Systems 營收 +14–19%(利潤率 25–26%);國際營收 +16%(中國資料中心需求 +19%)抵銷北美卡車 -20% 的疲弱。管理層預期下半年出現 EPA 2027 前的溫和預購潮,X15/X10 如期 2027 上市。股價一年翻倍、接近歷史高點(7/20 收 682.33 美元),市場已把「AI 電力第二受益者」的劇本計入不少;Q2 財報 8/4 公佈,觀察 Power Systems 利潤率能否守住 29% 級距。\n▸ 2026/9/25 更新:第二季(8/4)營收創同期紀錄 94.6 億美元,但每股盈餘 6.73 美元低於預期的 7.18 美元,稅息折舊攤銷前利潤率 17.5% 也低於去年同期 18.4%;全年營收成長指引上修至 10% 至 13%。公司與一家全球超大規模雲端業者簽下多年期協議,鎖定數吉瓦的資料中心備援電力需求,並連續第 17 年調升股利(+10%);但採礦引擎展望下修,Accelera 全年仍將虧損 2.6 億至 2.9 億美元。股價自 7 月高點 737.76 美元回落約三成至約 522 美元,部分基金已獲利了結。",
 en:"Q1 2026 (May 5) delivered $8.4B revenue (+3%) and $6.15 adjusted EPS, a near-10% beat, with full-year guidance raised: revenue +8–11% and Power Systems +14–19% at 25–26% margins; international revenue +16% (China data-center demand +19%) offset North American truck weakness (-20%). Management expects a modest H2 pre-buy ahead of EPA 2027, with X15/X10 launching on schedule in 2027. The stock has doubled in a year to near record highs ($682.33 on Jul 20), pricing in much of the 'second-order AI power beneficiary' script; Q2 results land Aug 4, with the key watch on whether Power Systems holds ~29% margins.\n▸ Update (Sep 25, 2026): Q2 (Aug 4) revenue hit a Q2 record of $9.46B, but earnings per share of $6.73 missed the $7.18 consensus and the margin on earnings before interest, taxes, depreciation and amortization slipped to 17.5% from 18.4%; full year revenue growth guidance was raised to 10% to 13%. Cummins signed a multiyear agreement with a global hyperscaler covering several gigawatts of future backup power and raised its dividend 10% for a 17th straight year, while trimming its mining engine outlook and guiding to $260M to $290M of Accelera losses. Shares have fallen roughly 30% from the July high of $737.76 to about $522 as some funds took profits."}]
]
},

sections:[
[{zh:"公司概覽",en:"Company Overview"},
{zh:"Vertiv 的血統可追溯至 1965 年創立的精密空調先驅 Liebert;2016 年 Emerson 把網絡能源事業(Emerson Network Power)出售給私募基金後更名 Vertiv,2020 年借殼上市,總部位於俄亥俄州 Westerville——與 Emerson 是知識庫內的「母子對照組」。產品覆蓋資料中心的電力鏈(UPS 不斷電系統、配電、母線槽、開關設備)與熱管理鏈(精密空調、液冷 CDU、冷板),再加上機櫃與全球服務網,是資料中心關鍵基礎設施覆蓋面最完整的獨立供應商。",
 en:"Vertiv's lineage traces to Liebert, the precision-cooling pioneer founded in 1965; in 2016 Emerson sold its Network Power business to private equity, which renamed it Vertiv, and it listed via SPAC in 2020 — making it the parent-child comparison pair with Emerson in this KB. Headquartered in Westerville, Ohio, its products span the data-center power chain (UPS, power distribution, busway, switchgear) and thermal chain (precision cooling, liquid-cooling CDUs, cold plates), plus racks and a global service network — the most complete independent supplier of data-center critical infrastructure."}],
[{zh:"商業模式",en:"Business Model"},
{zh:"Vertiv 賣的是「讓晶片不停機的物理層」:AI 晶片功耗與發熱暴衝,氣冷已到極限,液冷成為新建 AI 資料中心的預設架構——而 Vertiv 是少數能把電力+散熱+機櫃整包交付、並與 NVIDIA 共同定義參考設計的廠商。積壓訂單是理解這家公司的鑰匙:2025 年底達 150 億美元(年增 109%、Q4 book-to-bill 近 2.9 倍),等於鎖定未來 12–18 個月營收;售後服務與備品(約 22% 營收)則提供跨週期的黏性現金流。2029 年營業利益率目標 25%,槓桿在規模化與整合方案佔比提升。",
 en:"Vertiv sells the physical layer that keeps chips running: AI silicon's power draw and heat output have pushed air cooling to its limits, making liquid cooling the default for new AI data centers — and Vertiv is one of the few able to deliver power + thermal + racks as an integrated package, co-defining reference designs with NVIDIA. Backlog is the key to this company: $15.0B at year-end 2025 (+109%, Q4 book-to-bill ~2.9x) locks in 12–18 months of revenue, while services and spares (~22% of revenue) provide sticky through-cycle cash flow. The 2029 target of 25% operating margins leans on scale and a rising integrated-solutions mix."}],
[{zh:"子行業地位",en:"Sub-sector Position"},
{zh:"在資料中心關鍵基礎設施(電力+熱管理)領域,Vertiv 與 Schneider Electric 並列全球雙雄,液冷領域居領先集團;主要對手還包括剛以 Boyd 液冷補課的 Eaton(知識庫第 2 批)、Modine 與台達電等。它是四家「AI 電力鏈」收錄公司中純度最高者:GEV 賣渦輪機(發電)、ETN 賣配電(電網到機房)、CMI 賣備援引擎,Vertiv 則守住「機房到晶片」最後一哩。代價是最高的估值(前瞻約 50 倍)與最集中的客戶結構——超大規模雲商的資本支出一旦喘息,回檔也會最劇烈。",
 en:"In data-center critical infrastructure (power + thermal), Vertiv and Schneider Electric are the global duopoly, with Vertiv in the leading pack for liquid cooling; other rivals include Eaton (batch 2, which bought Boyd to catch up in liquid cooling), Modine and Delta Electronics. Among the four 'AI power chain' companies in this KB it is the purest play: GEV sells turbines (generation), ETN sells distribution (grid to room), CMI sells backup engines — Vertiv owns the last mile from room to chip. The price is the richest multiple (~50x forward) and the most concentrated customer base — if hyperscaler capex pauses, the drawdown will be the sharpest."}],
[{zh:"近期動態",en:"Recent Developments"},
{zh:"2026Q1(4 月底公佈)營收 26.5 億美元、調整後 EPS 年增 83%,全年營收指引上修至 135–140 億美元、EPS 成長約 50%;積壓維持 125–150 億美元高檔。6/18 股價收 333.05 美元、一週大漲 12%,市值約 1,280 億;7/20 收 331.44 美元,在歷史高位附近整理。多空焦點清晰:多方看液冷滲透率與 2029 年 25% 利潤率路徑,空方提醒 2022 年定價失誤重挫 71% 的前科與約 50 倍的前瞻本益比。Q2 財報 7/29 公佈(預期 EPS 約 1.43 美元),訂單與積壓數字將是 AI 資本支出的即時風向球。\n▸ 2026/9/25 更新:第二季(7/29)銷售 32.7 億美元、年增 24%,調整後每股盈餘 1.52 美元、年增 60%,調整後營業利益率 22.6%、提升 410 個基點,調整後自由現金流 9.25 億美元並轉為淨現金;但因供應鏈壅塞與大型分期專案,部分營收遞延到下半年,股價財報隔天單日重挫 17%。全年指引上修:銷售約 140 億美元(有機成長約 31%)、調整後每股盈餘 6.65 至 6.75 美元,第三季銷售指引年增約 40%;另收購 ThermoKey 與 Strategic Thermal Labs 強化散熱產品。股價約 251 美元,距 52 週高點約低三分之一。",
 en:"Q1 2026 (late April) delivered $2.65B revenue with adjusted EPS up 83%; full-year revenue guidance rose to $13.5–14.0B with ~50% EPS growth, and backlog held at an elevated $12.5–15B. The stock closed at $333.05 on Jun 18 (+12% that week, ~$128B market cap) and at $331.44 on Jul 20, consolidating near all-time highs. The debate is crisp: bulls see liquid-cooling penetration and the path to 25% margins by 2029; bears point to the 2022 pricing debacle (-71%) and a ~50x forward multiple. Q2 results land Jul 29 (consensus EPS ~$1.43) — the order and backlog prints will be a real-time barometer of AI capex.\n▸ Update (Sep 25, 2026): Q2 (Jul 29) sales of $3.27B rose 24%, adjusted earnings per share of $1.52 rose 60%, adjusted operating margin reached 22.6% (up 410 basis points) and adjusted free cash flow of $925M moved Vertiv to net cash; still, supply chain congestion and phased megaprojects pushed some revenue into the second half and the stock fell 17% the next day. Full year guidance rose to about $14.0B of sales (about 31% organic growth) and $6.65 to $6.75 adjusted earnings per share, with Q3 sales guided up about 40%; the ThermoKey and Strategic Thermal Labs acquisitions deepen its thermal lineup. At about $251 the shares sit roughly a third below the 52 week high."}]
]
},
